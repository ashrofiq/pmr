        <p class="text-xs text-gray-500 mb-2">${esc(x.siswa.nis)} · ${esc(x.siswa.kelas||'-')} · ${hitungUmur(x.siswa.tanggal_lahir)}</p>
        <div class="flex flex-wrap gap-1.5">${x.risks.map(r=>{const c=RISK_CATEGORIES[r];const d=x.details[r]?': '+x.details[r]:'';return `<span class="text-[11px] px-2 py-1 rounded-full bg-${c.color}-50 border border-${c.color}-200 text-${c.color}-700 font-medium whitespace-nowrap"><i class="fa-solid ${c.icon} mr-1"></i>${c.label}${esc(d)}</span>`;}).join('')}</div>
      </div>
      <div class="flex gap-2 shrink-0">
        <button onclick="View.go('siswa-detail',{id:${x.siswa.id}})" class="p-2 rounded-lg text-blue-600 hover:bg-blue-50"><i class="fa-solid fa-eye"></i></button>
        <button onclick="View.go('screening',{siswa_id:${x.siswa.id}})" class="p-2 rounded-lg text-emerald-600 hover:bg-emerald-50"><i class="fa-solid fa-stethoscope"></i></button>
      </div>
    </div></div>`).join('');
  };
  window.filterRawan=cat=>{activeCat=cat;document.querySelectorAll('.cat-btn').forEach(b=>{b.className=b.dataset.cat===cat?'cat-btn px-3 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white':'cat-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700';});renderList();};
  document.getElementById('rawanSearch').addEventListener('input',e=>{activeSearch=e.target.value.trim();renderList();});
  renderList();
}
window.exportSiswaRawan = () => {
  const all=analisaSiswaRawan();if(!all.length)return toast('Tidak ada siswa rawan','error');
  const rows=all.sort((a,b)=>b.severity-a.severity).map(x=>({
    'NIS':x.siswa.nis,'Nama':x.siswa.nama,'Kelas':x.siswa.kelas||'','Umur':hitungUmur(x.siswa.tanggal_lahir),

  }));
  exportExcel(rows,'Siswa Rawan',`Siswa_Rawan_UKS_${todayISO()}.xlsx`);
};

function getLaporanData(){
  const jenis=document.getElementById('lap_jenis').value;
  const kelas=document.getElementById('lap_kelas').value;
  const dari=document.getElementById('lap_dari').value;
  const sampai=document.getElementById('lap_sampai').value;

  if(jenis==='siswa'){
    const data=DB.db.siswa.filter(filterKelas);
    return {jenis,kelas,dari,sampai,headers:['NIS','Nama','Kelas','JK','Tgl Lahir','No HP','Nama Ayah','No HP Ayah','Nama Ibu','No HP Ibu','Umur','Gol','TA','Alamat','Alergi','Riwayat'],
      rows:data.map(s=>[s.nis,s.nama,s.kelas||'-',s.jenis_kelamin==='L'?'L':'P',s.tanggal_lahir||'-',telpEksport(s.no_hp)||'-',s.nama_ayah||'-',telpEksport(s.telp_ayah)||'-',s.nama_ibu||'-',telpEksport(s.telp_ibu)||'-',hitungUmur(s.tanggal_lahir),s.golongan_darah||'-',s.tahun_ajaran||'-',s.alamat||'-',s.alergi||'-',s.riwayat_penyakit||'-']),

      title:'Data Siswa UKS'};
  }
  if(jenis==='kunjungan'){

    return {jenis,kelas,dari,sampai,headers:['Waktu','NIS','Nama','Kelas','Prioritas','Keluhan','Tindakan','Status','Petugas'],
      rows:data.map(x=>[fmtDateTime(x.tanggal),x._s.nis,x._s.nama,x._s.kelas||'-',x.prioritas==='mendesak'?'Mendesak':'Biasa',x.keluhan,x.tindakan||'-',STATUS_KUNJUNGAN[x.status]?.label||x.status,x.petugas_nama||'-']),
      exportRows:data.map(x=>({'Waktu':fmtDateTime(x.tanggal),'NIS':x._s.nis,'Nama':x._s.nama,'Kelas':x._s.kelas||'','Prioritas':x.prioritas==='mendesak'?'Mendesak':'Biasa','Keluhan':x.keluhan,'Gejala':x.gejala||'','Tindakan':x.tindakan||'','Status':STATUS_KUNJUNGAN[x.status]?.label||x.status,'Petugas':x.petugas_nama||''})),
      title:'Laporan Kunjungan Pasien'};
  }
  if(jenis==='screening'){
    const data=DB.db.screening.filter(x=>inRange(x.tanggal)).map(x=>({...x,_s:DB.find('siswa',x.siswa_id)})).filter(x=>x._s&&filterKelas(x._s)).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
    return {jenis,kelas,dari,sampai,headers:['Tanggal','NIS','Nama','Kelas','TB','BB','IMT','Status','TD','Suhu','Nadi','Gula'],
      rows:data.map(x=>{const imt=x.imt?JSON.parse(x.imt):null;return [fmtDate(x.tanggal),x._s.nis,x._s.nama,x._s.kelas||'-',x.tinggi_badan||'-',x.berat_badan||'-',imt?.imt||'-',imt?.status||'-',x.tekanan_darah||'-',x.suhu||'-',x.nadi||'-',x.gula_darah||'-'];}),// eslint-disable-line
      exportRows:data.map(x=>{const imt=x.imt?JSON.parse(x.imt):null;return {'Tanggal':fmtDate(x.tanggal),'NIS':x._s.nis,'Nama':x._s.nama,'Kelas':x._s.kelas||'','TB (cm)':x.tinggi_badan||'','BB (kg)':x.berat_badan||'','IMT':imt?.imt||'','Status Gizi':imt?.status||'','TD':x.tekanan_darah||'','Suhu':x.suhu||'','Nadi':x.nadi||'','Respirasi':x.respirasi||'','Gula Darah (mg/dL)':x.gula_darah||'','Catatan':x.catatan||''};}),
      title:'Riwayat Screening'};
  }
  if(jenis==='rekam'){
    const data=DB.db.rekam.filter(x=>inRange(x.tanggal)).map(x=>({...x,_s:DB.find('siswa',x.siswa_id)})).filter(x=>x._s&&filterKelas(x._s)).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
    return {jenis,kelas,dari,sampai,headers:['Tanggal','NIS','Nama','Kelas','Keluhan','Diagnosis','Tindakan','Obat'],
      rows:data.map(x=>[fmtDateTime(x.tanggal),x._s.nis,x._s.nama,x._s.kelas||'-',x.keluhan,x.diagnosis||'-',x.tindakan||'-',x.obat||'-']),
      exportRows:data.map(x=>({'Tanggal':fmtDateTime(x.tanggal),'NIS':x._s.nis,'Nama':x._s.nama,'Kelas':x._s.kelas||'','Keluhan':x.keluhan,'Diagnosis':x.diagnosis||'','Tindakan':x.tindakan||'','Obat':x.obat||'','Catatan':x.catatan||''})),
      title:'Riwayat Rekam Medis'};

      exportRows:data.map(x=>({'NIS':x.siswa.nis,'Nama':x.siswa.nama,'Kelas':x.siswa.kelas||'','Umur':hitungUmur(x.siswa.tanggal_lahir),'Tingkat':x.level.toUpperCase(),'Skor':x.severity,'Kategori':x.risks.map(r=>RISK_CATEGORIES[r].label).join(', '),'Detail':x.risks.map(r=>x.details[r]||'').filter(Boolean).join(' | ')||'-'})),
      title:'Daftar Siswa Rawan'};
  }
  if(jenis==='obat'){
    const data=DB.db.permintaanObat.filter(x=>inRange(x.tanggal)).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
    return {jenis,kelas,dari,sampai,headers:['Tanggal','Obat','Jumlah','Penerima','Alasan','Status','Pemohon'],
      rows:data.map(p=>{
        const ob=DB.find('obat',p.obat_id);
        const pType=p.penerima_type||(p.siswa_id?'siswa':'umum');
        let penerima='Umum';
        if(pType==='siswa'&&p.siswa_id){const sw=DB.find('siswa',p.siswa_id);if(sw)penerima=`${sw.nama} (${sw.kelas||'-'})`;}
        else if((pType==='guru'||pType==='karyawan')&&p.penerima_nama)penerima=`${p.penerima_nama} (${PENERIMA_LABEL[pType]})`;
        return [fmtDateTime(p.tanggal),ob?.nama||'-',`${p.jumlah} ${ob?.satuan||''}`,penerima,p.alasan,STATUS_PERMINTAAN[p.status]?.label||p.status,p.pemohon_nama||'-'];
      }),
      exportRows:data.map(p=>{
        const ob=DB.find('obat',p.obat_id);
        const pType=p.penerima_type||(p.siswa_id?'siswa':'umum');
        let penerima='Umum';
        if(pType==='siswa'&&p.siswa_id){const sw=DB.find('siswa',p.siswa_id);if(sw)penerima=`${sw.nama} (${sw.kelas||'-'})`;}
        else if((pType==='guru'||pType==='karyawan')&&p.penerima_nama)penerima=p.penerima_nama;
        return {'Tanggal':fmtDateTime(p.tanggal),'Obat':ob?.nama||'-','Jumlah':p.jumlah,'Satuan':ob?.satuan||'','Jenis Penerima':PENERIMA_LABEL[pType]||'Umum','Penerima':penerima,'Alasan':p.alasan,'Status':STATUS_PERMINTAAN[p.status]?.label||p.status,'Pemohon':p.pemohon_nama||''};
      }),

  }
  if(jenis==='stok'){
    const data=DB.db.obat;
    return {jenis,kelas,dari,sampai,headers:['Nama','Kategori','Satuan','Stok','Min','Status'],

  }
  // Ringkasan
  const totalSiswa=DB.db.siswa.filter(filterKelas).length;
  const skr=DB.db.screening.filter(x=>inRange(x.tanggal)&&(()=>{const s=DB.find('siswa',x.siswa_id);return s&&filterKelas(s);})());
  const rkm=DB.db.rekam.filter(x=>inRange(x.tanggal)&&(()=>{const s=DB.find('siswa',x.siswa_id);return s&&filterKelas(s);})());
  const kunj=DB.db.kunjungan.filter(x=>inRange(x.tanggal)&&(()=>{const s=DB.find('siswa',x.siswa_id);return s&&filterKelas(s);})());
  const rawan=analisaSiswaRawan().filter(x=>filterKelas(x.siswa));
  const permintaan=DB.db.permintaanObat.filter(x=>inRange(x.tanggal));
  const statusGizi={Kurus:0,Normal:0,Gemuk:0,Obesitas:0};
  skr.forEach(x=>{if(x.imt){try{const imt=JSON.parse(x.imt);statusGizi[imt.status]=(statusGizi[imt.status]||0)+1;}catch{}}});
  const rows=[
    ['Total Siswa',totalSiswa],['Total Kunjungan',kunj.length],['Total Screening',skr.length],['Total Rekam Medis',rkm.length],

    ['— Permintaan Obat —',''],['Total Permintaan',permintaan.length],['Menunggu',permintaan.filter(p=>p.status==='menunggu').length],['Diberikan',permintaan.filter(p=>p.status==='diberikan').length],
    ['— Status Gizi —',''],['Kurus',statusGizi.Kurus||0],['Normal',statusGizi.Normal||0],['Gemuk',statusGizi.Gemuk||0],['Obesitas',statusGizi.Obesitas||0],
  ];
  return {jenis,kelas,dari,sampai,headers:['Keterangan','Jumlah'],rows,exportRows:rows.map(r=>({'Keterangan':r[0],'Jumlah':r[1]})),title:'Ringkasan Statistik UKS'};
}

function getTahunAjaranAktif(){ return DB.db.tahunAjaranAktif || (DB.db.tahunAjaran[0]||'-'); }

// Promosi kelas: XI → XII nomor tetap, X → XI pakai pembagian (manual), XII lulus
function promosiKelas(kelas, nis, pembagianTA){
  if(!kelas) return null;
  const m = String(kelas).match(/^(X|XI|XII)[-\s]?(\d+)$/i);
  if(!m) return null;
  const tingkat = m[1].toUpperCase(), nomor = m[2];
  if(tingkat === 'XII') return null;
  if(tingkat === 'XI')  return 'XII ' + nomor;
  // X → XI: WAJIB dari pembagian kelas
  if(pembagianTA && nis && pembagianTA[String(nis).trim()]) {
    return pembagianTA[String(nis).trim()];
  }
  return null;
}

window.tambahTahunAjaran = () => {
  if(Session.user().role!=='admin') return toast('Hanya admin','error');
  const inp = document.getElementById('newTahunAjaran');
  const val = inp.value.trim();
  if(!val) return toast('Nama tahun ajaran wajib diisi','error');
  if(!/^\d{4}\/\d{4}$/.test(val)) return toast('Format: 2025/2026','error');
  if(DB.db.tahunAjaran.includes(val)) return toast('Tahun ajaran sudah ada','error');
  DB.db.tahunAjaran.push(val);
  DB.db.tahunAjaran.sort();
  DB.save();
  toast('Tahun ajaran "'+val+'" ditambahkan');
  View.render();
};

window.setTahunAjaranAktif = (ta) => {
  if(Session.user().role!=='admin') return toast('Hanya admin','error');
  DB.db.tahunAjaranAktif = ta;
  DB.save();
  toast('Tahun ajaran aktif: '+ta);
  View.render();
};

window.hapusTahunAjaran = async (ta) => {
  if(Session.user().role!=='admin') return toast('Hanya admin','error');
  if(ta === DB.db.tahunAjaranAktif) return toast('Tidak bisa hapus tahun ajaran aktif','error');
  const count = DB.db.siswa.filter(s=>s.tahun_ajaran===ta).length;
  let msg = `Hapus tahun ajaran "${ta}"?`;
  if(count>0) msg += ` Ada ${count} siswa di tahun ini (data siswa tetap tersimpan).`;
  if(!await confirmDialog(msg)) return;
  DB.db.tahunAjaran = DB.db.tahunAjaran.filter(x=>x!==ta);
  DB.save();
  toast('Tahun ajaran dihapus');
  View.render();
};

window.prosesTahunAjaranBaru = async () => {
  if(Session.user().role!=='admin') return toast('Hanya admin','error');
  const dariTA = document.getElementById('taDari').value;
  const keTA   = document.getElementById('taKe').value.trim();
  if(!keTA) return toast('Tahun ajaran baru wajib diisi','error');
  if(!/^\d{4}\/\d{4}$/.test(keTA)) return toast('Format tahun: 2026/2027','error');
  if(DB.db.tahunAjaran.includes(keTA)) return toast('Tahun ajaran sudah ada','error');

  const aktifSiswa = DB.db.siswa.filter(s=>s.tahun_ajaran===dariTA);
  if(!aktifSiswa.length) return toast('Tidak ada siswa di tahun ajaran '+dariTA,'error');

  const pembagianTA = DB.db.pembagianKelas[keTA] || {};
  const jmlMapping  = Object.keys(pembagianTA).length;
  const kelasX      = aktifSiswa.filter(s => /^X[-\s]?\d+$/i.test(s.kelas||'')).length;
  const kelasXI     = aktifSiswa.filter(s => /^XI[-\s]?\d+$/i.test(s.kelas||'')).length;
  const kelasXII    = aktifSiswa.filter(s => /^XII[-\s]?\d+$/i.test(s.kelas||'')).length;

  let msg = `Proses kenaikan kelas dari ${dariTA} → ${keTA}?\n\n`;
  msg += `• Kelas XI  → XII : nomor kelas TETAP (XI 1 → XII 1). Ada ${kelasXI} siswa.\n`;
  msg += `• Kelas XII → LULUS : tidak disalin. Ada ${kelasXII} siswa.\n`;
  if(jmlMapping){
    msg += `• Kelas X   → XI : pakai pembagian kelas terupload (${jmlMapping} NIS dari ${kelasX} siswa X).\n`;
  } else {
    msg += `• Kelas X   → XI : ⚠ BELUM ada pembagian kelas. Siswa kelas X akan DILEWATI.\n`;
    msg += `  Silakan upload pembagian kelas dulu di panel "Upload Pembagian Kelas Baru".\n`;
  }
  if(!await confirmDialog(msg)) return;

  let promoted=0, graduated=0, skipped=0, noMapping=0;
  aktifSiswa.forEach(s=>{
    const newKelas = promosiKelas(s.kelas, s.nis, pembagianTA);
    if(!newKelas){
      if(/^X[-\s]?\d+$/i.test(s.kelas||'')) noMapping++;
      else graduated++;
      return;
    }
    if(!DB.db.kelas.includes(newKelas)){ skipped++; return; }
    DB.insert('siswa', {
      nis:s.nis, nama:s.nama, jenis_kelamin:s.jenis_kelamin,
      tanggal_lahir:s.tanggal_lahir, kelas:newKelas,
      golongan_darah:s.golongan_darah, no_hp:s.no_hp, nama_ayah:s.nama_ayah, nama_ibu:s.nama_ibu, telp_ayah:s.telp_ayah, telp_ibu:s.telp_ibu, alamat:s.alamat,
      alergi:s.alergi, riwayat_penyakit:s.riwayat_penyakit,
      tahun_ajaran:keTA
    });
    promoted++;
  });

  DB.db.tahunAjaran.push(keTA);
  DB.db.tahunAjaran.sort();
  DB.db.tahunAjaranAktif = keTA;
  DB.save();

  let r = `Selesai! ${promoted} siswa dipromosikan.`;
  if(graduated) r += ` ${graduated} siswa XII lulus.`;
  if(noMapping) r += ` ${noMapping} siswa X dilewati (belum ada pembagian).`;
  if(skipped)   r += ` ${skipped} dilewati (kelas tujuan belum terdaftar).`;
  toast(r);
  View.render();
};

function getSiswaKelasX(){
  const taAktif = DB.db.tahunAjaranAktif;
  return DB.db.siswa
    .filter(s => s.tahun_ajaran === taAktif && /^X[-\s]?\d+$/i.test(s.kelas||''))
    .sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
}

      <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full my-8">

              <div class="text-sm text-blue-900">
                <p class="font-semibold mb-1">Kolom Excel yang dibutuhkan:</p>
                <p class="text-xs font-mono bg-white/60 rounded p-2 mt-1">NIS* | Kelas Baru* &nbsp;(kolom Nama & Kelas Lama boleh ada, diabaikan)</p>
                <p class="text-xs mt-2">Siswa kelas X di TA aktif: <b>${list.length}</b> orang.</p>

                </button>
              </div>
            </div>
          </div>

          <div id="dropZonePbg" class="drop-zone rounded-2xl p-8 text-center cursor-pointer">
            <input type="file" id="fileInputPbg" accept=".xlsx,.xls,.csv" class="hidden"/>

            <div id="fileNamePbg" class="hidden mt-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 text-xs font-semibold"></div>
          </div>

              </table>
            </div>
          </div>

            <button type="button" id="btnSimpanPbg" disabled class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-semibold">

            </button>
          </div>
        </div>
      </div>
    </div>`;

  const dz = document.getElementById('dropZonePbg');
  const fi = document.getElementById('fileInputPbg');
  let parsed = [];

  const kelasSet = new Set(DB.db.kelas);
  const nisX = new Set(list.map(s => String(s.nis).trim()));

  const handleFile = file => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(!json.length) return toast('File kosong','error');

        parsed = json.map(row => {
          const g = (...keys) => {
            for(const k of Object.keys(row)){
              const kk = k.toLowerCase().replace(/[^a-z0-9]/g,'');
              if(keys.some(t=>kk.includes(t))) return row[k];
            }
            return '';
          };
          const nis = String(g('nis','nomorinduk')||'').trim();
          const kelasBaru = String(g('kelasbaru','kelas_baru','newclass')||'').trim().toUpperCase().replace(/[-\s]+/g,' ');
          const nama = String(g('nama')||'').trim();
          const err = [];
          if(!nis) err.push('NIS kosong');
          else if(!nisX.has(nis)) err.push('NIS bukan siswa kelas X di TA aktif');
          if(!kelasBaru) err.push('Kelas Baru kosong');
          else if(!kelasSet.has(kelasBaru)) err.push(`Kelas "${kelasBaru}" belum terdaftar`);
          return { nis, nama, kelasBaru, _valid: err.length===0, _err: err };
        });

        const valid = parsed.filter(r=>r._valid).length;
        const invalid = parsed.length - valid;

        document.getElementById('fileNamePbg').classList.remove('hidden');
        document.getElementById('fileNamePbg').innerHTML = `<i class="fa-solid fa-file-excel"></i> ${esc(file.name)} (${parsed.length} baris)`;
        document.getElementById('previewPbg').classList.remove('hidden');
        document.getElementById('previewPbgCount').textContent = parsed.length;
        document.getElementById('previewPbgValid').textContent = valid + ' valid';
        document.getElementById('previewPbgInvalid').textContent = invalid + ' invalid';

        document.getElementById('previewPbgHead').innerHTML =
          ['NIS','Nama','Kelas Baru','Status'].map(h=>`<th class="px-3 py-2 text-left font-semibold text-gray-600">${h}</th>`).join('');

        document.getElementById('previewPbgBody').innerHTML = parsed.slice(0,50).map(r=>`
          <tr class="${r._valid?'':'bg-rose-50'}">
            <td class="px-3 py-2">${esc(r.nis)}</td>
            <td class="px-3 py-2">${esc(r.nama||'-')}</td>
            <td class="px-3 py-2 font-semibold">${esc(r.kelasBaru||'-')}</td>
            <td class="px-3 py-2">${r._valid?'<span class="text-emerald-600 font-semibold">✓ OK</span>':`<span class="text-rose-600 font-semibold">✗ ${esc(r._err.join(', '))}</span>`}</td>
          </tr>`).join('') + (parsed.length>50?`<tr><td colspan="4" class="px-3 py-2 text-center text-gray-500">... dan ${parsed.length-50} lainnya</td></tr>`:'');

        document.getElementById('btnSimpanPbg').disabled = valid===0;
        document.getElementById('btnSimpanPbg').innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan ${valid} Pembagian`;
      } catch(err){ toast('Gagal membaca file: '+err.message,'error'); }
    };
    reader.readAsArrayBuffer(file);
  };

  fi.addEventListener('change', e=>handleFile(e.target.files[0]));
  dz.addEventListener('click', ()=>fi.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });

  document.getElementById('btnSimpanPbg').addEventListener('click', ()=>{
    const taKeNow = document.getElementById('pembagianTA').value;
    const valid = parsed.filter(r=>r._valid);
    if(!DB.db.pembagianKelas[taKeNow]) DB.db.pembagianKelas[taKeNow] = {};
    valid.forEach(r=>{ DB.db.pembagianKelas[taKeNow][r.nis] = r.kelasBaru; });

    toast(`Pembagian kelas ${taKeNow} disimpan: ${valid.length} siswa`);
    closeModal();
    View.render();
  });
};

window.addKelas = () => {
  if(Session.user().role!=='admin'){toast('Hanya admin','error');return;}
  const input=document.getElementById('newKelasName');
  const nama=normKelas(input.value);
  if(!nama){toast('Nama kelas wajib diisi','error');input.focus();return;}
  if(DB.db.kelas.includes(nama)){toast('Kelas sudah ada','error');return;}
  DB.db.kelas.push(nama);
  DB.db.kelas.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  DB.save();
  toast('Kelas "'+nama+'" ditambahkan');
  View.render();
};

window.hapusKelas = async nama => {
  if(Session.user().role!=='admin'){toast('Hanya admin','error');return;}
  const used=DB.db.siswa.filter(s=>s.kelas===nama).length;
  let msg=`Hapus kelas "${nama}"?`;
  if(used>0)msg+=` Ada ${used} siswa di kelas ini. Siswa tidak akan terhapus, hanya kelasnya hilang dari daftar.`;
  if(!await confirmDialog(msg))return;
  DB.db.kelas=DB.db.kelas.filter(k=>k!==nama);
  DB.save();
  toast('Kelas dihapus');
  View.render();
};

window.backupData=()=>{

  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);

window.restoreData=file=>{
  if(Session.user()?.role!=='admin')return toast('Hanya admin','error');
  if(!file)return;
  const r=new FileReader();
  r.onload=async e=>{
    let obj;try{obj=JSON.parse(e.target.result);}catch{return toast('File bukan JSON yang valid','error');}
    const d=obj&&obj.data?obj.data:obj;
    if(!d||!Array.isArray(d.users)||!Array.isArray(d.siswa)||!d.meta)return toast('Format backup tidak dikenali','error');
    if(!await confirmDialog(`Pulihkan data dari backup?\n\n• ${d.siswa.length} siswa, ${(d.screening||[]).length} screening, ${(d.rekam||[]).length} rekam medis\n• Data saat ini akan DIGANTI (salinan otomatis disimpan di browser).\n• Anda akan diminta login ulang.`))return;
    try{localStorage.setItem(DB.KEY+'_prerestore',JSON.stringify(DB.db));}catch{}
    if(!DB.write(d))return;
    DB.load();Session.clear();toast('Data berhasil dipulihkan. Silakan login ulang.');View.render();
  };
  r.readAsText(file);
};

    for(const [k,t] of Object.entries(this.TABLES)){
      const snap=this.snap[k],ups=[],seen=new Set();
      for(const r of DB.db[k]){seen.add(r.id);const js=JSON.stringify(r);if(snap.get(r.id)!==js)ups.push({r,js});}
      const dels=[...snap.keys()].filter(id=>!seen.has(id));
      for(let i=0;i<ups.length;i+=200){const ch=ups.slice(i,i+200);
        await this.req('POST',`/rest/v1/${t}?on_conflict=id`,ch.map(x=>this.toRow(k,x.r)),{Prefer:'resolution=merge-duplicates,return=minimal'});
        ch.forEach(x=>snap.set(x.r.id,x.js));}
      for(let i=0;i<dels.length;i+=100){const ch=dels.slice(i,i+100);
        await this.req('DELETE',`/rest/v1/${t}?id=in.(${ch.join(',')})`,undefined,{Prefer:'return=minimal'});ch.forEach(id=>snap.delete(id));}
    }
    const sets=this.SET_KEYS.filter(k=>this.setSnap[k]!==JSON.stringify(DB.db[k]));
    if(sets.length){
      const snapNow=sets.map(k=>[k,JSON.stringify(DB.db[k])]);
      await this.req('POST','/rest/v1/rpc/uks_save_settings',{p_kelas:DB.db.kelas,p_ta:DB.db.tahunAjaran,p_ta_aktif:DB.db.tahunAjaranAktif,p_pembagian:DB.db.pembagianKelas});
      snapNow.forEach(([k,js])=>this.setSnap[k]=js);
    }
  },
  // ---- Kelola user staf (fungsi SQL khusus admin: uks_create_user, uks_update_user, uks_set_user_active, uks_delete_user) ----
  async reloadUsers(){
    DB.db.users=(await this.req('GET','/rest/v1/profiles?select=*&order=full_name')).map(x=>({id:x.id,username:x.username,full_name:x.full_name,role:x.role,is_active:x.is_active}));
  },
  async saveUser(id,d){
    try{
      const uname=d.username.trim().toLowerCase();
      if(!/^[a-z0-9._-]{3,30}$/.test(uname))return toast('Username 3-30 karakter: huruf kecil, angka, titik, strip, underscore (tanpa spasi)','error');
      if(d.password&&d.password.length<6)return toast('Password minimal 6 karakter','error');
      if(!id&&!d.password)return toast('Password wajib diisi','error');
      if(id){
        await this.req('POST','/rest/v1/rpc/uks_update_user',{p_id:id,p_full_name:d.full_name,p_username:uname,p_role:d.role,p_password:d.password||null});
        toast('User diperbarui');
      }else{
        await this.req('POST','/rest/v1/rpc/uks_create_user',{p_username:uname,p_full_name:d.full_name,p_password:d.password,p_role:d.role});
        toast('User ditambahkan. Login: '+uname);
      }
      await this.reloadUsers();closeModal();View.render();
    }catch(e){toast('Gagal menyimpan user: '+e.message,'error');}
  },
  async setUserActive(id,aktif){
    try{await this.req('POST','/rest/v1/rpc/uks_set_user_active',{p_id:id,p_active:aktif});await this.reloadUsers();toast(aktif?'Diaktifkan':'Dinonaktifkan','info');View.render();}
    catch(e){toast('Gagal: '+e.message,'error');}
  },
  async deleteUser(id){
    try{await this.req('POST','/rest/v1/rpc/uks_delete_user',{p_id:id});await this.reloadUsers();toast('User dihapus');View.render();}
    catch(e){toast('Gagal menghapus: '+e.message,'error');}
  },
  async siswaLogin(u,p){return (await this.req('POST','/rest/v1/rpc/siswa_login',{p_user:u,p_pass:p}))||{ok:false,error:'Respon kosong'};},
  applySiswa(x){
    this.role='siswa';const ta=x.ta||x.siswa.tahun_ajaran||'-';
    const scr=(x.screening||[]).map(r=>this.fromRow('screening',r));
    const fr=(k,a)=>(Array.isArray(a)?a:[]).map(r=>this.fromRow(k,r));   // v3.2.0: riwayat lengkap jika RPC siswa_login mengirimnya
    DB.db=this.shape({siswa:[this.fromRow('siswa',x.siswa)],screening:scr,rekam:fr('rekam',x.rekam),kunjungan:fr('kunjungan',x.kunjungan),permintaanObat:fr('permintaanObat',x.permintaan_obat),obat:fr('obat',x.obat),tahunAjaran:[ta],tahunAjaranAktif:ta,kelas:[]});
    this.snap={screening:new Map(scr.map(r=>[r.id,'x']))};
  },
  async pushSiswa(){
    const known=this.snap.screening,me=DB.db.siswa[0];
    const fresh=DB.db.screening.filter(r=>!known.has(r.id));
    for(const r of fresh){
      const res=await this.req('POST','/rest/v1/rpc/siswa_submit',{p_user:this.cred.u,p_pass:this.cred.p,p_scr:r,p_kes:{golongan_darah:me.golongan_darah||'',alergi:me.alergi||'',riwayat_penyakit:me.riwayat_penyakit||''}});
      if(!res||!res.ok){known.set(r.id,'x');DB.db.screening=DB.db.screening.filter(z=>z.id!==r.id);throw new Error((res&&res.error)||'Gagal menyimpan screening');}
      known.set(r.id,'x');
    }
    if(fresh.length){const x=await this.siswaLogin(this.cred.u,this.cred.p);if(x.ok){this.applySiswa(x);View.render();}}
  },
  async boot(){
    const x=this.loadSess();
    if(x){this.sess=x;
      try{await this.token();const p=await this.req('GET','/rest/v1/profiles?select=*&id=eq.'+x.uid);
        if(p&&p[0]&&p[0].is_active){this.role=p[0].role;await this.pull();Session.set({id:p[0].id,username:p[0].username,full_name:p[0].full_name,role:p[0].role});View.render();return;}
      }catch(e){console.warn(e);}
      this.saveSess(null);
    }
    Session.clear();View.render();
  },
  async refresh(){
    if(this.role==='siswa')return;
    try{await this.flush();await this.pull();toast('Data dimuat ulang dari server','info');View.render();}
    catch(e){toast('Gagal memuat ulang: '+e.message,'error');}
  },
  logout(){this.saveSess(null);this.role=null;this.cred=null;this.snap={};this.dirty=false;DB.load();}
};

async function cloudLogin(){
  const q=id=>document.getElementById(id);
  const username=q('loginUser').value.trim(),password=q('loginPass').value;
  const alertBox=q('loginAlert'),btn=q('loginBtn'),txt=q('loginBtnText'),ic=btn.querySelector('i');
  const fail=m=>{alertBox.className='rounded-xl px-4 py-3 text-sm bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2';alertBox.innerHTML='<i class="fa-solid fa-circle-exclamation"></i><span>'+esc(m)+'</span>';btn.disabled=false;txt.textContent='Masuk';ic.className='fa-solid fa-right-to-bracket';};
  if(!username||!password)return fail('Username dan password wajib diisi');
  btn.disabled=true;txt.textContent='Memproses...';ic.className='fa-solid fa-spinner fa-spin';
  try{
    const p=await Cloud.staffLogin(username,password);
    if(p){await Cloud.pull();Session.set({id:p.id,username:p.username,full_name:p.full_name,role:p.role});toast('Login berhasil! Selamat datang, '+p.full_name);View.current='dashboard';View.render();return;}
    const pwS=pwSiswaKirim(password);
    if(!pwS)return fail('Username atau password salah');
    const x=await Cloud.siswaLogin(username,pwS);
    if(!x.ok)return fail(x.error||'Username atau password salah');
    Cloud.cred={u:username,p:pwS};Cloud.applySiswa(x);
    Session.set({id:'S'+x.siswa.id,username:username.toLowerCase(),full_name:x.siswa.nama,role:'siswa',siswa_id:x.siswa.id});
    toast('Selamat datang, '+x.siswa.nama);View.current='dashboard';View.render();
  }catch(e){fail('Gagal terhubung ke server: '+e.message);}
}

// ==================== INIT ====================
if(CLOUD_ON){
  DB.read=()=>null;                                  // data tidak disimpan di browser
  DB.write=function(){Cloud.schedule();return true;}; // setiap perubahan disinkronkan ke Supabase
  DB.insert=function(t,data){const row={id:Cloud.newId(),created_at:new Date().toISOString(),...data};this.db[t].push(row);this.save();return row;};
  window.restoreData=file=>{
    if(Session.user()?.role!=='admin')return toast('Hanya admin','error');
    if(!file)return;
    const rd=new FileReader();
    rd.onload=async ev=>{
      let obj;try{obj=JSON.parse(ev.target.result);}catch{return toast('File bukan JSON yang valid','error');}
      const d=obj&&obj.data?obj.data:obj;
      if(!d||!Array.isArray(d.siswa)||!d.meta)return toast('Format backup tidak dikenali','error');
      if(!await confirmDialog(`Unggah backup ke Supabase?\n\n• ${d.siswa.length} siswa, ${(d.screening||[]).length} screening, ${(d.rekam||[]).length} rekam medis\n• Data di server akan DIGANTI sesuai isi backup.`))return;
      const keep=DB.db.users;DB.db=Cloud.shape({...d,users:keep});DB.save();
      try{await Cloud.flush();toast('Backup berhasil diunggah ke Supabase');}catch(e){toast('Gagal unggah: '+e.message,'error');}
      View.render();
    };
    rd.readAsText(file);
  };
  window.addEventListener('beforeunload',e=>{if(Cloud.dirty||Cloud.busy){e.preventDefault();e.returnValue='';}});
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&Cloud.role&&Cloud.role!=='siswa'&&!Cloud.dirty&&!Cloud.busy&&Date.now()-Cloud.pulledAt>10*60*1000&&!document.getElementById('modalContainer').innerHTML.trim())Cloud.refresh();
  });
}
initFavicon();
DB.load();
if(DB.corruptKey)setTimeout(()=>toast('Data lama rusak & tidak terbaca. Salinan disimpan di key "'+DB.corruptKey+'". Hubungi admin/pengembang sebelum input data baru.','error'),600);
if(CLOUD_ON){document.getElementById('app').innerHTML='<div class="min-h-screen flex items-center justify-center text-gray-500">Memuat…</div>';Cloud.boot();}
else View.render();
</script>
