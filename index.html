// Format nama kelas: pakai spasi, bukan tanda hubung (X-1 -> X 1)
function normKelas(k){return String(k==null?'':k).replace(/\s*-\s*/g,' ').replace(/\s+/g,' ').trim();}
// Ubah format kelas pada data yang sudah ada; mengembalikan true bila ada yang berubah
function normalizeKelasDb(db){
  let c=false;
  if(Array.isArray(db.kelas)){const n=[...new Set(db.kelas.map(normKelas))];if(JSON.stringify(n)!==JSON.stringify(db.kelas)){db.kelas=n;c=true;}}
  (db.siswa||[]).forEach(x=>{if(x.kelas){const n=normKelas(x.kelas);if(n!==x.kelas){x.kelas=n;c=true;}}});
  const pb=db.pembagianKelas;
  if(pb&&typeof pb==='object')Object.values(pb).forEach(m=>{if(m&&typeof m==='object')Object.keys(m).forEach(nis=>{const n=normKelas(m[nis]);if(n!==m[nis]){m[nis]=n;c=true;}});});
  return c;
}

function firstName(n){return String(n||'').trim().split(/\s+/)[0].toLowerCase();}
function tglDigits(t){const m=String(t||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+m[2]+m[1]:'';}
// Password siswa HANYA format YYYY-MM-DD (dikirim apa adanya; RPC siswa_login di server membandingkannya dengan kolom tanggal_lahir).
function pwSiswaKirim(pw){const t=String(pw).trim();return /^\d{4}-\d{2}-\d{2}$/.test(t)?t:null;}
function loginSiswa(username,password){
  const u=String(username).trim().toLowerCase();
  const pw=String(password).trim();
  if(!u||!/^\d{4}-\d{2}-\d{2}$/.test(pw))return {};
  const ta=DB.db.tahunAjaranAktif;
  const cand=DB.db.siswa.filter(s=>(!s.tahun_ajaran||s.tahun_ajaran===ta)&&s.tanggal_lahir

  if(cand.length>1)return {pesan:'Ada siswa dengan nama depan & tanggal lahir yang sama. Gunakan NIS sebagai username.'};
  return {};
}

  const g=document.getElementById('sc_goldar');if(!g||!id)return;
  DB.update('siswa',id,{golongan_darah:g.value,alergi:document.getElementById('sc_alergi').value.trim(),riwayat_penyakit:document.getElementById('sc_riwayat').value.trim()});
}

// ==================== PASSWORD HASH (SHA-256 sinkron, tanpa dependensi) ====================
function sha256(ascii){
  const rrot=(v,a)=>(v>>>a)|(v<<(32-a));
  const mp=Math.pow,mw=mp(2,32);let result='';const words=[];const abl=ascii.length*8;
  let hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length;const ic={};
  for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((abl/mw)|0);words[words.length]=(abl);
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rrot(e,6)^rrot(e,11)^rrot(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rrot(w15,7)^rrot(w15,18)^(w15>>>3))+w[i-7]+(rrot(w2,17)^rrot(w2,19)^(w2>>>10)))|0);
      const t2=(rrot(a,2)^rrot(a,13)^rrot(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;
  }
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}
function newSalt(){try{const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}catch{return Math.random().toString(16).slice(2)+Date.now().toString(16);}}
function hashPw(salt,pw){return sha256(salt+':'+unescape(encodeURIComponent(String(pw))));}
function pwFields(pw){const salt=newSalt();return {salt,password_hash:hashPw(salt,pw)};}
function verifyPassword(u,pw){
  if(!u)return false;
  if(u.password_hash&&u.salt)return hashPw(u.salt,pw)===u.password_hash;
  return false;
}
const DEFAULT_PWS=['admin123','petugas123'];

// ==================== STORAGE ====================
const DB = {
  KEY:'uks_db_v2',
  init(){
    let db = this.read();
    const defaultTA = '2025/2026';
    const seedUsers = () => [
      { id:1, username:'admin', ...pwFields('admin123'), must_change:false, full_name:'Administrator UKS', role:'admin', is_active:1, created_at:new Date().toISOString() },
      { id:2, username:'petugas', ...pwFields('petugas123'), must_change:false, full_name:'Petugas UKS', role:'petugas', is_active:1, created_at:new Date().toISOString() }
    ];
    if(!db){
      db = {
        users: seedUsers(),
        siswa:[], rekam:[], screening:[], kunjungan:[], obat:[...SEED_OBAT], permintaanObat:[],
        kelas:[...DEFAULT_KELAS],
        tahunAjaran:[defaultTA],
        tahunAjaranAktif:defaultTA,
        pembagianKelas:{},
        meta:{ nextUserId:3, nextSiswaId:1, nextRekamId:1, nextScreeningId:1, nextKunjunganId:1, nextObatId:SEED_OBAT.length+1, nextPermintaanObatId:1 }
      };
      this.write(db);
    } else {
      let c=false;
      if(!db.users || !Array.isArray(db.users) || db.users.length===0){
        db.users = seedUsers(); c=true;
      } else {
        const hasAdmin = db.users.some(u=>u.role==='admin');
        if(!hasAdmin){ db.users = seedUsers(); c=true; }
      }
      (db.users||[]).forEach(u=>{
        if(u.password!==undefined&&!u.password_hash){
          const pw=String(u.password);Object.assign(u,pwFields(pw));
        }
        if('password' in u){delete u.password;c=true;}
      });
      if(!db.kunjungan){db.kunjungan=[];c=true;}
      if(!db.obat||!db.obat.length){db.obat=[...SEED_OBAT];c=true;}
      if(!db.permintaanObat){db.permintaanObat=[];c=true;}
      if(!db.meta){db.meta={};c=true;}
      if(!db.kelas||!Array.isArray(db.kelas)||!db.kelas.length){db.kelas=[...DEFAULT_KELAS];c=true;}
      if(!db.tahunAjaran||!Array.isArray(db.tahunAjaran)||!db.tahunAjaran.length){db.tahunAjaran=[defaultTA];c=true;}
      if(!db.tahunAjaranAktif){db.tahunAjaranAktif=db.tahunAjaran[db.tahunAjaran.length-1];c=true;}
      if(!db.pembagianKelas||typeof db.pembagianKelas!=='object'){db.pembagianKelas={};c=true;}
      (db.siswa||[]).forEach(s=>{if(!s.tahun_ajaran){s.tahun_ajaran=db.tahunAjaranAktif;c=true;}});
      if(normalizeKelasDb(db))c=true;
      (db.users||[]).forEach(u=>{if(u.must_change){u.must_change=false;c=true;}});
      const d={nextUserId:3,nextSiswaId:1,nextRekamId:1,nextScreeningId:1,nextKunjunganId:1,nextObatId:SEED_OBAT.length+1,nextPermintaanObatId:1};
      Object.keys(d).forEach(k=>{if(!db.meta[k]){db.meta[k]=d[k];c=true;}});
      if(c) this.write(db);
    }
    return db;
  },
  corruptKey:null,
  read(){
    const raw=localStorage.getItem(this.KEY);
    if(raw===null)return null;
    try{return JSON.parse(raw);}
    catch(e){
      // JANGAN timpa data rusak: simpan salinannya dulu agar bisa dipulihkan manual
      this.corruptKey=this.KEY+'_corrupt_'+Date.now();
      try{localStorage.setItem(this.corruptKey,raw);}catch{}
      return null;
    }
  },
  write(db){
    try{localStorage.setItem(this.KEY,JSON.stringify(db));return true;}
    catch(e){
      try{toast('GAGAL menyimpan data (penyimpanan browser penuh/diblokir). Segera lakukan Backup di menu Setting!','error');}catch{}
      return false;
    }
  },
  save(){this.write(this.db);},
  load(){this.db=this.init();return this.db;},
  insert(t,data){
    const idKey={users:'nextUserId',siswa:'nextSiswaId',rekam:'nextRekamId',screening:'nextScreeningId',kunjungan:'nextKunjunganId',obat:'nextObatId',permintaanObat:'nextPermintaanObatId'}[t];
    const id=this.db.meta[idKey]++;
    const row={id,created_at:new Date().toISOString(),...data};
    this.db[t].push(row); this.save(); return row;
  },
  update(t,id,data){
    const i=this.db[t].findIndex(r=>r.id===id);
    if(i===-1) return null;
    this.db[t][i]={...this.db[t][i],...data}; this.save(); return this.db[t][i];
  },
  delete(t,id){this.db[t]=this.db[t].filter(r=>r.id!==id);this.save();},
  find(t,id){return this.db[t].find(r=>r.id===id);}
};

// ==================== SESSION ====================
const Session = {
  KEY:'uks_session',
  set(u){localStorage.setItem(this.KEY,JSON.stringify({user:u,loginAt:new Date().toISOString()}));},
  get(){try{return JSON.parse(localStorage.getItem(this.KEY));}catch{return null;}},
  clear(){localStorage.removeItem(this.KEY);},
  TTL:8*60*60*1000,
  user(){
    const s=this.get();if(!s||!s.user)return null;
    const age=Date.now()-new Date(s.loginAt).getTime();
    if(isNaN(age)||age>this.TTL){this.clear();return null;}
    if(s.user.role==='siswa'){
      const sw=(typeof DB!=='undefined'&&DB.db)?DB.db.siswa.find(x=>x.id===s.user.siswa_id):null;
      if(!sw||(sw.tahun_ajaran&&sw.tahun_ajaran!==DB.db.tahunAjaranAktif)){this.clear();return null;}
      return {id:'S'+sw.id,siswa_id:sw.id,username:s.user.username,full_name:sw.nama,role:'siswa'};
    }
    const du=(typeof DB!=='undefined'&&DB.db&&DB.db.users)?DB.db.users.find(x=>x.id===s.user.id):null;
    if(!du||!u_isActive(du)){this.clear();return null;}
    return {id:du.id,username:du.username,full_name:du.full_name,role:du.role};
  }
};

// ==================== UTILS ====================
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(d){if(!d)return '-';const dt=new Date(d);if(isNaN(dt))return '-';return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(d){if(!d)return '-';const dt=new Date(d);if(isNaN(dt))return '-';return dt.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function hitungUmur(t){if(!t)return '-';const b=new Date(t),n=new Date();if(isNaN(b))return '-';let u=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))u--;return u+' thn';}
function hitungIMT(bb,tb){if(!bb||!tb||tb<=0)return null;const t=tb/100;const imt=bb/(t*t);let s='Normal',c='emerald';if(imt<18.5){s='Kurus';c='amber';}else if(imt>=25&&imt<30){s='Gemuk';c='orange';}else if(imt>=30){s='Obesitas';c='rose';}return {imt:imt.toFixed(1),status:s,color:c};}

function toast(msg,type='success'){
  const colors={success:'bg-emerald-500',error:'bg-rose-500',info:'bg-blue-500'};
  const icons={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'};
  const el=document.createElement('div');
  el.className=`${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 slide-in`;
  el.innerHTML=`<i class="fa-solid ${icons[type]}"></i><span class="text-sm font-medium">${esc(msg)}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);},3500);
}

function confirmDialog(msg){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.className='fixed inset-0 z-[90] bg-black/50 flex items-center justify-center p-4 slide-up';

function setupKelasSiswaFilter(kelasId, siswaId, preselectSiswaId = null){
  const kelasSel = document.getElementById(kelasId);
  const siswaSel = document.getElementById(siswaId);
  if(!kelasSel || !siswaSel) return;
  const taAktif = DB.db.tahunAjaranAktif;
  const update = () => {
    const k = kelasSel.value;
    if(!k){
      siswaSel.innerHTML = '<option value="">- Pilih kelas dulu -</option>';
      siswaSel.disabled = true;
      return;
    }
    const list = DB.db.siswa
      .filter(s => s.kelas === k && (!s.tahun_ajaran || s.tahun_ajaran === taAktif))
      .sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    siswaSel.disabled = false;
    if(!list.length){
      siswaSel.innerHTML = '<option value="">- Tidak ada siswa di kelas ini -</option>';
      return;
    }
    siswaSel.innerHTML = '<option value="">- Pilih Siswa -</option>' +
      list.map(s => `<option value="${s.id}" ${s.id===preselectSiswaId?'selected':''}>${esc(s.nis)} · ${esc(s.nama)}</option>`).join('');
  };
  kelasSel.addEventListener('change', update);
  if(preselectSiswaId){
    const sw = DB.find('siswa', preselectSiswaId);
    if(sw && sw.kelas && getKelasList().includes(sw.kelas)) kelasSel.value = sw.kelas;
  }
  update();
}

// ==================== EXCEL HELPERS ====================
function parseExcelDate(v){
  if(!v)return null;
  if(v instanceof Date){const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');return `${y}-${m}-${d}`;}
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.substring(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function exportExcel(rows,sheetName,filename){
  try{
    const ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(k.length,...rows.map(r=>String(r[k]??'').length),10)}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,sheetName.substring(0,31));
    XLSX.writeFile(wb,filename);
    toast('File Excel berhasil diunduh');
  }catch(e){toast('Gagal export: '+e.message,'error');}
}

// ==================== ANALISIS SISWA RAWAN ====================
// Aturan "sering registrasi pasien": minimal JUMLAH kunjungan dalam HARI terakhir
const SERING_KUNJUNGAN = { jumlah:3, hari:30 };
const RISK_CATEGORIES = {
  sering_kunjungan:{label:'Sering Kunjungan UKS',color:'indigo',icon:'fa-clipboard-user',desc:'Sering registrasi sebagai pasien'},
  alergi:{label:'Alergi',color:'rose',icon:'fa-triangle-exclamation',desc:'Siswa dengan alergi'},
  riwayat:{label:'Riwayat Penyakit',color:'amber',icon:'fa-notes-medical',desc:'Ada riwayat penyakit'},
  gizi_kurang:{label:'Gizi Kurang',color:'orange',icon:'fa-arrow-down',desc:'IMT < 18.5'},
  gizi_lebih:{label:'Gizi Lebih/Obesitas',color:'rose',icon:'fa-arrow-up',desc:'IMT ≥ 25'},
  hipertensi:{label:'Hipertensi',color:'red',icon:'fa-heart-crack',desc:'TD ≥ 140/90'},
  hipotensi:{label:'Hipotensi',color:'blue',icon:'fa-heart-pulse',desc:'TD < 90/60'},
  demam:{label:'Suhu Tinggi',color:'orange',icon:'fa-temperature-high',desc:'Suhu ≥ 37.5°C'},
  gula_darah:{label:'Gula Darah Abnormal',color:'purple',icon:'fa-droplet',desc:'Gula darah di luar normal'},
};
function parseTD(td){if(!td)return null;const m=String(td).match(/(\d{2,3})\s*\/\s*(\d{2,3})/);if(!m)return null;return {sys:parseInt(m[1]),dia:parseInt(m[2])};}
function analisaSiswaRawan(){
  const today=new Date();
  const taAktif = DB.db.tahunAjaranAktif;
  return DB.db.siswa.filter(s=>!s.tahun_ajaran||s.tahun_ajaran===taAktif).map(s=>{
    const risks=[],details={};
    if(s.alergi&&s.alergi.trim()){risks.push('alergi');details.alergi=s.alergi.trim();}
    if(s.riwayat_penyakit&&s.riwayat_penyakit.trim()){risks.push('riwayat');details.riwayat=s.riwayat_penyakit.trim();}
    const scr=DB.db.screening.filter(x=>x.siswa_id===s.id).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
    const last=scr[0];
    const kjCut=Date.now()-SERING_KUNJUNGAN.hari*864e5;
    const nKj=DB.db.kunjungan.filter(k=>k.siswa_id===s.id&&new Date(k.tanggal).getTime()>=kjCut).length;
    const sering=nKj>=SERING_KUNJUNGAN.jumlah;
    if(!last){
      // Belum screening tidak dimasukkan ke siswa rawan, kecuali sering registrasi sebagai pasien
      if(!sering)return null;
      risks.length=0;Object.keys(details).forEach(k=>delete details[k]);
    }
    if(sering){risks.push('sering_kunjungan');details.sering_kunjungan=`${nKj}x kunjungan dalam ${SERING_KUNJUNGAN.hari} hari`;}
    if(last){
      if(last.imt){try{const imt=JSON.parse(last.imt);
        if(imt.status==='Kurus'){risks.push('gizi_kurang');details.gizi_kurang=`IMT ${imt.imt}`;}
        else if(imt.status==='Gemuk'||imt.status==='Obesitas'){risks.push('gizi_lebih');details.gizi_lebih=`IMT ${imt.imt}`;}
      }catch{}}
      const td=parseTD(last.tekanan_darah);
      if(td){
        if(td.sys>=140||td.dia>=90){risks.push('hipertensi');details.hipertensi=`TD ${td.sys}/${td.dia}`;}
        else if(td.sys<90||td.dia<60){risks.push('hipotensi');details.hipotensi=`TD ${td.sys}/${td.dia}`;}
      }
      if(last.suhu&&last.suhu>=37.5){risks.push('demam');details.demam=`Suhu ${last.suhu}°C`;}
      if(last.gula_darah){
        const gd=parseFloat(last.gula_darah);
        if(gd>=200){risks.push('gula_darah');details.gula_darah=`${gd} mg/dL (Tinggi)`;}
        else if(gd<70){risks.push('gula_darah');details.gula_darah=`${gd} mg/dL (Rendah)`;}
      }
    }
    const sev=risks.reduce((n,r)=>n+({hipertensi:3,gizi_lebih:3,demam:2,gizi_kurang:2,hipotensi:2,gula_darah:3,alergi:1,riwayat:1,sering_kunjungan:3}[r]||1),0);
    let level='rendah',levelColor='emerald';
    if(sev>=6){level='tinggi';levelColor='rose';}else if(sev>=3){level='sedang';levelColor='amber';}
    return {siswa:s,risks,details,severity:sev,level,levelColor,lastScr:last};
  }).filter(x=>x&&x.risks.length>0);
}

const RIWAYAT_META={
  screening:{label:'Screening',color:'emerald',icon:'fa-stethoscope'},
  kunjungan:{label:'Kunjungan UKS',color:'indigo',icon:'fa-clipboard-user'},
  rekam:{label:'Rekam Medis',color:'blue',icon:'fa-notes-medical'},
  permintaan:{label:'Permintaan Obat',color:'amber',icon:'fa-pills'}
};
function buildRiwayatSiswa(id){
  const items=[];const ms=d=>{const t=new Date(d).getTime();return isNaN(t)?0:t;};
  DB.db.screening.filter(x=>x.siswa_id===id).forEach(s=>{
    const im=parseImtSafe(s);
    items.push({type:'screening',ms:ms(s.tanggal),waktu:fmtDate(s.tanggal),title:'Screening Kesehatan',
      badge:im?{text:`IMT ${im.imt} · ${im.status}`,color:im.color||'gray'}:null,
      rows:[['Tinggi / Berat',(s.tinggi_badan||s.berat_badan)?`${s.tinggi_badan||'-'} cm / ${s.berat_badan||'-'} kg`:''],['Tekanan darah',s.tekanan_darah],['Suhu',s.suhu?s.suhu+' °C':''],['Nadi',s.nadi?s.nadi+' x/mnt':''],['Respirasi',s.respirasi?s.respirasi+' x/mnt':''],['Gula darah',s.gula_darah?s.gula_darah+' mg/dL':''],['Mata',s.mata],['Telinga',s.telinga],['Gigi & mulut',s.gigi_mulut],['Kulit',s.kulit],['Catatan',s.catatan],['Petugas',s.petugas_nama]]});
  });
  DB.db.kunjungan.filter(x=>x.siswa_id===id).forEach(k=>{
    const st=STATUS_KUNJUNGAN[k.status];
    items.push({type:'kunjungan',ms:ms(k.tanggal),waktu:fmtDateTime(k.tanggal),title:k.keluhan||'Kunjungan UKS',badge:st?{text:st.label,color:st.color}:null,
      rows:[['Gejala',k.gejala],['Prioritas',k.prioritas],['Tindakan',k.tindakan],['Catatan',k.catatan],['Petugas',k.petugas_nama]]});
  });
  DB.db.rekam.filter(x=>x.siswa_id===id).forEach(r=>{
    items.push({type:'rekam',ms:ms(r.tanggal),waktu:fmtDateTime(r.tanggal),title:r.keluhan||'Rekam Medis',badge:r.diagnosis?{text:r.diagnosis,color:'blue'}:null,
      rows:[['Diagnosis',r.diagnosis],['Tindakan',r.tindakan],['Obat',r.obat],['Catatan',r.catatan],['Petugas',r.petugas_nama]]});
  });
  DB.db.permintaanObat.filter(p=>p.siswa_id===id).forEach(p=>{
    const st=STATUS_PERMINTAAN[p.status];const ob=DB.find('obat',p.obat_id);
    items.push({type:'permintaan',ms:ms(p.tanggal),waktu:fmtDateTime(p.tanggal),title:`${ob?.nama||'Obat'} × ${p.jumlah||'-'}${ob?.satuan?' '+ob.satuan:''}`,badge:st?{text:st.label,color:st.color}:null,
      rows:[['Alasan',p.alasan],['Catatan admin',p.catatan_admin],['Diberikan',p.tanggal_diberikan?fmtDateTime(p.tanggal_diberikan):'']]});
  });
  return items.sort((a,b)=>b.ms-a.ms);
}

  const m=RIWAYAT_META[it.type];
  const rows=it.rows.filter(r=>r[1]!==undefined&&r[1]!==null&&String(r[1]).trim()!=='');
  return `<div class="flex gap-3">
    <div class="w-10 h-10 rounded-full bg-${m.color}-100 flex items-center justify-center shrink-0"><i class="fa-solid ${m.icon} text-${m.color}-600"></i></div>
    <div class="flex-1 min-w-0 bg-white border border-gray-100 rounded-xl p-4 shadow-sm">

        <div class="text-right"><p class="text-xs text-gray-500">${it.waktu}</p>${it.badge?`<span class="inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full bg-${it.badge.color}-100 text-${it.badge.color}-700 font-semibold">${esc(it.badge.text)}</span>`:''}</div>
      </div>
      ${rows.length?`<div class="grid sm:grid-cols-2 gap-x-6 gap-y-1 mt-2 text-xs">${rows.map(r=>`<div class="flex gap-2"><span class="text-gray-400 w-28 shrink-0">${r[0]}</span><span class="text-gray-700 font-medium">${esc(r[1])}</span></div>`).join('')}</div>`:''}
    </div></div>`;
}

function renderRiwayatSiswa(page){

    </section>

      <div class="glass rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-7">
          ${LOGO_FULL_HTML}
          <h3 class="text-xl font-bold text-gray-800 mt-3">Selamat Datang</h3>
          <p class="text-sm text-gray-500 mt-1">Silakan masuk ke akun Anda</p>
        </div>
        <form id="loginForm" class="space-y-4">
          <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Username</label>
            <div class="flex items-center gap-3 bg-white border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all"><i class="fa-solid fa-user text-gray-400"></i><input id="loginUser" type="text" required placeholder="Masukkan username" class="w-full bg-transparent outline-none text-sm"/></div></div>
          <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Password</label>
            <div class="flex items-center gap-3 bg-white border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all"><i class="fa-solid fa-lock text-gray-400"></i><input id="loginPass" type="password" required placeholder="Masukkan password" class="w-full bg-transparent outline-none text-sm"/><button type="button" id="togglePass" class="text-gray-400 hover:text-gray-600"><i id="eyeIcon" class="fa-solid fa-eye"></i></button></div></div>
          <div id="loginAlert" class="hidden rounded-xl px-4 py-3 text-sm"></div>
          <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 disabled:opacity-60"><i class="fa-solid fa-right-to-bracket"></i><span id="loginBtnText">Masuk</span></button>
        </form>
        <div class="relative my-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div><div class="relative flex justify-center text-xs"><span class="bg-white/80 px-3 text-gray-400">${esc(APP_SUBNAME)}</span></div></div>
        <p class="text-center text-[11px] text-gray-500 mb-2"><i class="fa-solid fa-graduation-cap"></i> <b>Siswa:</b> username = nama depan, password = tanggal lahir (YYYY-MM-DD, contoh 2008-05-15)</p>
        <p class="text-center text-xs text-gray-500">Belum punya akun? <span class="text-blue-600 font-semibold">Hubungi Administrator</span></p>
      </div>
      <p class="text-center text-xs text-gray-400 mt-6">© ${new Date().getFullYear()} ${esc(APP_NAME)} · v${APP_VERSION}</p>
    </section>
  </main>`;
  const toggle=document.getElementById('togglePass');
  const pwd=document.getElementById('loginPass');
  const eye=document.getElementById('eyeIcon');
  toggle.onclick=()=>{const t=pwd.type==='text';pwd.type=t?'password':'text';eye.className=t?'fa-solid fa-eye':'fa-solid fa-eye-slash';};
  document.getElementById('loginForm').addEventListener('submit',e=>{
    e.preventDefault();
    if(CLOUD_ON){cloudLogin();return;}
    const username=document.getElementById('loginUser').value.trim();
    const password=pwd.value;
    const alertBox=document.getElementById('loginAlert');
    const btn=document.getElementById('loginBtn');
    const txt=document.getElementById('loginBtnText');
    const ic=btn.querySelector('i');
    if(!username||!password){
      alertBox.className='rounded-xl px-4 py-3 text-sm bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2';
      alertBox.innerHTML='<i class="fa-solid fa-circle-exclamation"></i><span>Username dan password wajib diisi</span>';
      return;
    }
    btn.disabled=true;txt.textContent='Memproses...';ic.className='fa-solid fa-spinner fa-spin';
    setTimeout(()=>{
      let user=DB.db.users.find(u=>u.username===username && verifyPassword(u,password));
      let pesanSiswa='';
      if(!user){const r=loginSiswa(username,password);if(r.siswa){user={id:'S'+r.siswa.id,siswa_id:r.siswa.id,username:username.toLowerCase(),full_name:r.siswa.nama,role:'siswa',is_active:1};}else pesanSiswa=r.pesan||'';}
      if(!user || !u_isActive(user)){
        alertBox.className='rounded-xl px-4 py-3 text-sm bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-2';
        alertBox.innerHTML='<i class="fa-solid fa-circle-exclamation"></i><span>'+esc(pesanSiswa||'Username atau password salah, atau akun tidak aktif')+'</span>';
        btn.disabled=false;txt.textContent='Masuk';ic.className='fa-solid fa-right-to-bracket';
        return;
      }
      Session.set({id:user.id,username:user.username,full_name:user.full_name,role:user.role,siswa_id:user.siswa_id});
      toast('Login berhasil! Selamat datang, '+user.full_name);
      if(user.role==='admin'){const lb=DB.db.meta.lastBackup;if(!lb||(Date.now()-new Date(lb).getTime())>7*864e5)setTimeout(()=>toast('Sudah lebih dari 7 hari sejak backup terakhir. Buka Setting → Backup Data.','info'),1200);}
      View.current='dashboard';View.render();
    },400);
  });
}

function renderShell(){
  const user=Session.user();
  const rawanCount=analisaSiswaRawan().length;
  const kunjunganAktif=user.role==='siswa'?0:DB.db.kunjungan.filter(k=>k.status==='menunggu'||k.status==='diperiksa').length;
  const permintaanPending=DB.db.permintaanObat.filter(p=>p.status==='menunggu').length;
  const stokRendah=DB.db.obat.filter(o=>o.stok<=o.stok_min).length;

  const belumCount=user.role==='siswa'?0:getBelumScreening().length;
  const menu = [
    { id:'dashboard', icon:'fa-gauge-high',  label:'Dashboard',         roles:['admin','petugas','siswa'] },
    { id:'siswa',     icon:'fa-users',       label:'Data Siswa',        roles:['admin','petugas'] },
    { id:'screening', icon:'fa-stethoscope', label:'Screening', roles:['admin','petugas'], badge: belumCount, badgeColor:'amber' },
    { id:'screening', icon:'fa-stethoscope', label:'Screening Mandiri', roles:['siswa'] },
    { id:'riwayat',   icon:'fa-clock-rotate-left', label:'Riwayat Kesehatan', roles:['siswa'] },
    { id:'permintaan',icon:'fa-pills',       label:'Permintaan Obat',   roles:['admin','petugas'], badge: permintaanPending, badgeColor:'amber' },
    { id:'kunjungan', icon:'fa-clipboard-user',label:'Registrasi Pasien',roles:['admin','petugas'], badge: kunjunganAktif, badgeColor:'blue' },
    { id:'rawan',     icon:'fa-user-injured',label:'Siswa Rawan',       roles:['admin','petugas'], badge: rawanCount, badgeColor:'rose' },
    { id:'laporan',   icon:'fa-file-lines',  label:'Laporan',           roles:['admin','petugas'] },
    { id:'obat',      icon:'fa-prescription-bottle-medical', label:'Stok Obat', roles:['admin','petugas'], badge: stokRendah, badgeColor:'rose' },
    { id:'setting',   icon:'fa-gear',        label:'Setting',           roles:['admin'] },

  const badgeOf = m => m.badge ? `<span class="ml-auto text-[10px] font-bold px-1.5 py-0.5 rounded-full ${m.badgeColor==='rose'?'bg-rose-500':m.badgeColor==='amber'?'bg-amber-500':'bg-blue-500'} text-white">${m.badge}</span>` : '';

    if(m.children){
      const childActive = m.children.some(c=>c.id===View.current);
      return `<div>
        <button onclick="toggleNavGroup('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-left ${childActive?'bg-blue-50 text-blue-700':'text-gray-600 hover:bg-blue-50 hover:text-blue-700'}">
          <i class="fa-solid ${m.icon} w-4 text-center text-sm"></i><span class="font-medium text-sm">${m.label}</span>${badgeOf(m)}<i id="chv_${m.id}" class="fa-solid fa-chevron-down text-[10px] ${m.badge?'ml-1':'ml-auto'} transition-transform ${childActive?'rotate-180':''}"></i>
        </button>
        <div id="grp_${m.id}" class="${childActive?'':'hidden'} mt-0.5 ml-5 pl-3 border-l border-gray-200 space-y-0.5">
          ${m.children.map(c=>{const ca=View.current===c.id;return `<button onclick="View.go('${c.id}')" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition-all text-left ${ca?'bg-blue-600 text-white shadow-md shadow-blue-600/30':'text-gray-600 hover:bg-blue-50 hover:text-blue-700'}"><i class="fa-solid ${c.icon} w-4 text-center text-xs"></i><span class="font-medium text-[13px]">${c.label}</span></button>`;}).join('')}
        </div>
      </div>`;
    }
    const active = View.current===m.id || (m.id==='siswa'&&View.current==='siswa-detail') || (m.id==='screening'&&user.role!=='siswa'&&['screening-daftar','screening-belum'].includes(View.current));
    return `<button onclick="View.go('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-left ${active?'bg-blue-600 text-white shadow-md shadow-blue-600/30':'text-gray-600 hover:bg-blue-50 hover:text-blue-700'}">
      <i class="fa-solid ${m.icon} w-4 text-center text-sm"></i><span class="font-medium text-sm">${m.label}</span>${badgeOf(m)}</button>`;
  }).join('');

  const taAktif = DB.db.tahunAjaranAktif || '-';

  document.getElementById('app').innerHTML = `
  <div class="min-h-screen flex bg-slate-50">
    <aside id="sidebar" class="fixed lg:sticky top-0 h-screen w-64 bg-white border-r border-gray-200 flex flex-col -translate-x-full lg:translate-x-0 transition-transform z-40">
      <div class="px-3 py-3 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 shrink-0">${LOGO_ICON_SVG}</div>
          <div class="flex-1 min-w-0">
            <p class="font-black text-sm text-gray-800 leading-tight"><span class="text-emerald-700">UKS</span> SMANSAQ</p>
            <p class="text-[10px] text-gray-500 truncate">${esc(user.full_name)} · ${user.role==='admin'?'Admin':user.role==='siswa'?'Siswa':'Petugas'}</p>
          </div>
        </div>
        <div class="mt-2 text-[10px] text-gray-400 flex items-center gap-1">
          <i class="fa-solid fa-calendar-days"></i> TA: <span class="font-semibold text-gray-600">${esc(taAktif)}</span>
          <span class="ml-auto text-gray-300">v${APP_VERSION}</span>
        </div>
      </div>
      <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto">${nav}</nav>
      <div class="p-2 border-t border-gray-100">
        ${CLOUD_ON&&user.role!=='siswa'?`<button onclick="Cloud.refresh()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-600 hover:bg-blue-50 transition-colors text-left"><i class="fa-solid fa-rotate w-4 text-center text-sm"></i><span class="font-medium text-sm">Muat Ulang Data</span></button>`:''}
        <button onclick="doLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-rose-600 hover:bg-rose-50 transition-colors text-left">
          <i class="fa-solid fa-right-from-bracket w-4 text-center text-sm"></i>
          <span class="font-medium text-sm">Keluar</span>
        </button>
        <p class="text-[10px] text-gray-400 text-center mt-2">© ${new Date().getFullYear()} ${esc(APP_NAME)} · v${APP_VERSION}</p>
      </div>
    </aside>
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="lg:hidden sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
        <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-bars text-gray-700"></i></button>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7">${LOGO_ICON_SVG}</div>
          <span class="font-black text-gray-800 text-sm"><span class="text-emerald-700">UKS</span> SMANSAQ</span>
        </div>
        ${kunjunganAktif?`<span class="text-xs font-bold px-2 py-1 rounded-full bg-blue-500 text-white">${kunjunganAktif}</span>`:'<div class="w-8"></div>'}
      </header>
      <main id="page" class="flex-1 p-4 lg:p-8"></main>
    </div>
  </div>`;

  const page = document.getElementById('page');
  const renderers = {
    dashboard:(p)=>user.role==='siswa'?renderDashboardSiswa(p):renderDashboard(p), siswa:renderSiswa, rawan:renderSiswaRawan,
    'screening-daftar':renderScreeningDaftar, 'screening-belum':renderScreeningBelum, riwayat:renderRiwayatSiswa,
    screening:renderScreening, kunjungan:renderKunjungan, permintaan:renderPermintaan,
    obat:renderStokObat, laporan:renderLaporan, setting:renderSetting
  };
  if(View.current==='siswa-detail') renderSiswaDetail(page,View.params.id);
  else if(renderers[View.current]) renderers[View.current](page);
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.toggle('hidden');
}
async function doLogout(){
  if(!await confirmDialog('Yakin ingin keluar dari aplikasi?')) return;
  if(CLOUD_ON){await Cloud.flush();Cloud.logout();}
  Session.clear();View.current='login';View.render();toast('Anda telah keluar','info');
}

  const rawan=analisaSiswaRawan();

      <button onclick="openPermintaanForm()" class="flex items-center gap-4 text-left bg-white hover:bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 transition-all shadow-sm hover:shadow-md"><div class="w-14 h-14 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-pills text-white text-2xl"></i></div><div class="flex-1"><p class="font-bold text-gray-800 text-lg">Permintaan Obat</p><p class="text-xs text-gray-500">Ajukan permintaan obat dari stok UKS</p></div><i class="fa-solid fa-plus text-emerald-500"></i></button>
    </div>

      ${card('Permintaan Obat',stats.permintaanPending,'fa-pills','amber')}
    </div>
    ${stokRendah.length?`<div class="bg-amber-50 border border-amber-200 rounded-2xl p-5 slide-up"><div class="flex items-start gap-3"><div class="w-11 h-11 rounded-full bg-amber-100 flex items-center justify-center shrink-0"><i class="fa-solid fa-triangle-exclamation text-amber-600 text-lg"></i></div><div class="flex-1"><p class="font-bold text-amber-800">⚠ ${stokRendah.length} Obat Stok Rendah</p><p class="text-xs text-amber-700 mt-1">${stokRendah.map(o=>`${o.nama} (${o.stok} ${o.satuan})`).join(' · ')}</p>${user.role!=='siswa'?`<button onclick="View.go('obat')" class="mt-2 text-xs font-semibold text-amber-700 hover:underline">Kelola stok obat →</button>`:''}</div></div></div>`:''}
  `;

function card(label,value,icon,color){
  return `<div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow slide-up">
    <div class="w-12 h-12 rounded-xl bg-${color}-100 flex items-center justify-center mb-3"><i class="fa-solid ${icon} text-${color}-600 text-xl"></i></div>

window.closeModal = () => { document.getElementById('modalContainer').innerHTML=''; };

window.hapusSiswa = async id => {
  if(Session.user().role!=='admin'){toast('Hanya admin','error');return;}
  const s=DB.find('siswa',id);if(!s)return;
  if(!await confirmDialog(`Hapus siswa "${s.nama}"? Semua riwayat akan terhapus.`))return;
  DB.db.rekam=DB.db.rekam.filter(r=>r.siswa_id!==id);
  DB.db.screening=DB.db.screening.filter(r=>r.siswa_id!==id);
  DB.db.kunjungan=DB.db.kunjungan.filter(r=>r.siswa_id!==id);
  DB.delete('siswa',id);toast('Siswa berhasil dihapus');View.render();
};

window.exportSiswa = () => {
  if(!DB.db.siswa.length)return toast('Belum ada data siswa','error');
  const rows=DB.db.siswa.map(s=>({
    'NIS':s.nis,'Nama':s.nama,'Kelas':s.kelas||'','Jenis Kelamin':s.jenis_kelamin==='L'?'Laki-laki':'Perempuan',
    'Tanggal Lahir':s.tanggal_lahir||'','No HP':telpEksport(s.no_hp),'Nama Ayah':s.nama_ayah||'','No HP Ayah':telpEksport(s.telp_ayah),'Nama Ibu':s.nama_ibu||'','No HP Ibu':telpEksport(s.telp_ibu),
    'Umur':hitungUmur(s.tanggal_lahir),'Golongan Darah':s.golongan_darah||'','Tahun Ajaran':s.tahun_ajaran||'','Alamat':s.alamat||'',
    'Alergi':s.alergi||'','Riwayat Penyakit':s.riwayat_penyakit||''
  }));
  exportExcel(rows,'Data Siswa',`Data_Siswa_UKS_${todayISO()}.xlsx`);
};

          <div>

            <select id="importTahunAjaran" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm bg-white">
              ${DB.db.tahunAjaran.map(ta=>`<option value="${esc(ta)}" ${ta===DB.db.tahunAjaranAktif?'selected':''}>${esc(ta)} ${ta===DB.db.tahunAjaranAktif?'(aktif)':''}</option>`).join('')}
            </select>
            <p class="text-[10px] text-gray-500 mt-1">Siswa akan dimasukkan ke tahun ajaran ini. Duplikat dicek per NIS + tahun ajaran.</p>
          </div>
          <div id="dropZone" class="drop-zone rounded-2xl p-8 text-center cursor-pointer"><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden"/><i class="fa-solid fa-cloud-arrow-up text-5xl text-gray-400 mb-3"></i><p class="font-semibold text-gray-700">Klik atau drag & drop file</p><div id="fileName" class="hidden mt-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 text-xs font-semibold"></div></div>
          <div id="importPreview" class="hidden"><p class="text-sm font-semibold text-gray-700 mb-2">Preview (<span id="previewCount">0</span>):</p><div class="border border-gray-200 rounded-xl overflow-hidden max-h-60 overflow-y-auto"><table class="w-full text-xs"><thead class="bg-gray-50 sticky top-0"><tr id="previewHead"></tr></thead><tbody id="previewBody" class="divide-y divide-gray-100"></tbody></table></div></div>

        </div>
      </div>
    </div>`;
  const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
  let parsed=[];
  const handleFile=file=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{

            alergi:String(g('alergi')||'').trim(),riwayat_penyakit:String(g('riwayatpenyakit','riwayat','penyakit')||'').trim(),
            _valid:true,_err:[]
          };
        });
        parsed.forEach(r=>{if(!r.nis){r._err.push('NIS kosong');r._valid=false;}if(!r.nama){r._err.push('Nama kosong');r._valid=false;}if(!r.jenis_kelamin){r._err.push('JK harus L/P');r._valid=false;}
          if(r.kelas){const kc=getKelasList().find(k=>k.toLowerCase()===r.kelas.toLowerCase());if(kc)r.kelas=kc;else{r._err.push('Kelas tidak terdaftar');r._valid=false;}}});
        document.getElementById('fileName').classList.remove('hidden');
        document.getElementById('fileName').innerHTML=`<i class="fa-solid fa-file-excel"></i> ${esc(file.name)} (${parsed.length} baris)`;
        document.getElementById('importPreview').classList.remove('hidden');
        document.getElementById('previewCount').textContent=parsed.length;
        document.getElementById('previewHead').innerHTML=['NIS','Nama','JK','Tgl Lahir','Kelas','Status'].map(h=>`<th class="px-3 py-2 text-left font-semibold text-gray-600">${h}</th>`).join('');
        document.getElementById('previewBody').innerHTML=parsed.slice(0,10).map(r=>`
          <tr class="${r._valid?'':'bg-rose-50'}"><td class="px-3 py-2">${esc(r.nis)}</td><td class="px-3 py-2">${esc(r.nama)}</td><td class="px-3 py-2">${esc(r.jenis_kelamin)}</td><td class="px-3 py-2">${esc(r.tanggal_lahir||'-')}</td><td class="px-3 py-2">${esc(r.kelas||'-')}</td><td class="px-3 py-2">${r._valid?'<span class="text-emerald-600 font-semibold">✓ OK</span>':`<span class="text-rose-600 font-semibold">✗ ${esc(r._err.join(', '))}</span>`}</td></tr>`).join('')+(parsed.length>10?`<tr><td colspan="6" class="px-3 py-2 text-center text-gray-500">... dan ${parsed.length-10} lainnya</td></tr>`:'');
        const vc=parsed.filter(r=>r._valid).length;
        document.getElementById('btnProsesImport').disabled=vc===0;
        document.getElementById('btnProsesImport').innerHTML=`<i class="fa-solid fa-file-import mr-2"></i> Import ${vc} Data`;
      }catch(err){toast('Gagal membaca file: '+err.message,'error');}
    };
    reader.readAsArrayBuffer(file);
  };
  fi.addEventListener('change',e=>handleFile(e.target.files[0]));
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleFile(e.dataTransfer.files[0]);});
  document.getElementById('btnProsesImport').addEventListener('click',()=>{
    const taTujuan = document.getElementById('importTahunAjaran')?.value || DB.db.tahunAjaranAktif;
    const valid=parsed.filter(r=>r._valid);let ins=0,upd=0;
    valid.forEach(r=>{
      const dup=DB.db.siswa.find(s=>s.nis===r.nis && s.tahun_ajaran===taTujuan);
      const body={
        nis:r.nis,nama:r.nama,jenis_kelamin:r.jenis_kelamin,
        tanggal_lahir:r.tanggal_lahir,kelas:r.kelas,
        golongan_darah:r.golongan_darah,no_hp:r.no_hp,nama_ayah:r.nama_ayah,nama_ibu:r.nama_ibu,telp_ayah:r.telp_ayah,telp_ibu:r.telp_ibu,alamat:r.alamat,
        alergi:r.alergi,riwayat_penyakit:r.riwayat_penyakit,
        tahun_ajaran:taTujuan
      };
      if(dup){DB.update('siswa',dup.id,body);upd++;}else{DB.insert('siswa',body);ins++;}
    });
    toast(`Import selesai (TA ${taTujuan}): ${ins} ditambahkan, ${upd} diperbarui`);
    closeModal();View.render();
  });
};

window.cetakRiwayatSiswa = id => {
  const sw=DB.find('siswa',id);if(!sw)return;
  const rkm=DB.db.rekam.filter(r=>r.siswa_id===id).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
  const scr=DB.db.screening.filter(r=>r.siswa_id===id).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
  const kjn=DB.db.kunjungan.filter(r=>r.siswa_id===id).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
  const risk=Session.user()?.role==='siswa'?null:analisaSiswaRawan().find(x=>x.siswa.id===id);
  const rows=[];
  kjn.forEach(k=>rows.push(['Kunjungan',fmtDateTime(k.tanggal),k.keluhan,'-',k.tindakan||'-',STATUS_KUNJUNGAN[k.status]?.label||k.status]));
  scr.forEach(s=>{const imt=s.imt?JSON.parse(s.imt):null;rows.push(['Screening',fmtDate(s.tanggal),`TB: ${s.tinggi_badan||'-'} cm, BB: ${s.berat_badan||'-'} kg`,imt?`${imt.imt} (${imt.status})`:'-',`TD: ${s.tekanan_darah||'-'}, Suhu: ${s.suhu||'-'}°C, Gula: ${s.gula_darah||'-'} mg/dL`,'-']);});
  DB.db.permintaanObat.filter(p=>p.siswa_id===id).forEach(p=>rows.push(['Permintaan Obat',fmtDateTime(p.tanggal),p.alasan||'-','-',(DB.find('obat',p.obat_id)?.nama||'Obat')+' x'+(p.jumlah||'-'),STATUS_PERMINTAAN[p.status]?.label||p.status]));
  rkm.forEach(r=>rows.push(['Rekam Medis',fmtDateTime(r.tanggal),r.keluhan,r.diagnosis||'-',r.tindakan||'-',r.obat||'-']));
  const footer=`<div style="margin-top:16px;padding:10px;border:1px solid #333;font-size:11px"><p style="margin:0 0 4px;font-weight:600">Biodata:</p><p style="margin:2px 0">NIS: ${esc(sw.nis)} · Nama: ${esc(sw.nama)} · Kelas: ${esc(sw.kelas||'-')} · TA: ${esc(sw.tahun_ajaran||'-')}</p><p style="margin:2px 0">Alergi: ${esc(sw.alergi||'-')} · Riwayat: ${esc(sw.riwayat_penyakit||'-')}</p>${risk?`<p style="margin:6px 0 0;font-weight:600;color:#dc2626">⚠ Rawan: ${risk.level.toUpperCase()} (skor ${risk.severity})</p>`:''}</div>`;
  printReport({title:'Riwayat Kesehatan Siswa',subtitle:sw.nama,meta:`NIS: ${sw.nis}`,headers:['Jenis','Tanggal','Keluhan','Diagnosis/IMT','Tindakan','Catatan/Status'],rows,footer});
};

            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Suhu (°C)</label><input id="sc_suhu" type="number" step="0.1" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Nadi (x/mnt)</label><input id="sc_nadi" type="number" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Respirasi (x/mnt)</label><input id="sc_respirasi" type="number" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 flex items-center gap-1"><i class="fa-solid fa-droplet text-rose-500"></i> Gula Darah</label><input id="sc_gula_darah" type="number" min="0" placeholder="mg/dL" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
          </div></div>
        <div><h3 class="font-semibold text-gray-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-eye text-emerald-600"></i> Pemeriksaan Fisik</h3>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Mata</label><input id="sc_mata" placeholder="Normal / minus" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Telinga</label><input id="sc_telinga" placeholder="Normal / serumen" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Gigi & Mulut</label><input id="sc_gigi" placeholder="Normal / caries" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5">Kulit</label><input id="sc_kulit" placeholder="Normal" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
          </div></div>
        <div><h3 class="font-semibold text-gray-800 mb-1 flex items-center gap-2"><i class="fa-solid fa-notes-medical text-amber-600"></i> Data Kesehatan Dasar</h3>
          <p class="text-[11px] text-gray-500 mb-3">Terhubung dengan Data Siswa: perubahan di sini otomatis memperbarui data siswa.</p>
          <div class="grid sm:grid-cols-3 gap-4">
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Golongan Darah</label><select id="sc_goldar" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm bg-white"><option value="">-</option><option>A</option><option>B</option><option>AB</option><option>O</option></select></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Alergi</label><input id="sc_alergi" placeholder="Mis. seafood, debu (kosongkan jika tidak ada)" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Riwayat Penyakit</label><input id="sc_riwayat" placeholder="Mis. asma (kosongkan jika tidak ada)" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
          </div></div>
        <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Catatan</label><textarea id="sc_catatan" rows="3" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"></textarea></div>
        <div class="flex gap-3 justify-end pt-2"><button type="reset" class="px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium">Reset</button><button type="submit" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-floppy-disk mr-2"></i> Simpan</button></div>
      </form>
    </div>`;
  setupKelasSiswaFilter('sc_kelas','sc_siswa',preId);
  const fillKes=()=>{
    const sid=Number(document.getElementById('sc_siswa').value);const sw=sid?DB.find('siswa',sid):null;
    const gs=document.getElementById('sc_goldar');const gd=sw?.golongan_darah||'';
    if(gd&&![...gs.options].some(o=>o.value===gd))gs.add(new Option(gd,gd));
    gs.value=gd;document.getElementById('sc_alergi').value=sw?.alergi||'';document.getElementById('sc_riwayat').value=sw?.riwayat_penyakit||'';
  };
  const scKelasEl=document.getElementById('sc_kelas');if(scKelasEl)scKelasEl.addEventListener('change',()=>setTimeout(fillKes,0));
  document.getElementById('sc_siswa').addEventListener('change',fillKes);
  document.getElementById('screeningForm').addEventListener('reset',()=>setTimeout(fillKes,0));
  fillKes();
  const updateIMT=()=>{const tb=parseFloat(document.getElementById('sc_tb').value);const bb=parseFloat(document.getElementById('sc_bb').value);const r=hitungIMT(bb,tb);document.getElementById('sc_imt').value=r?`${r.imt} (${r.status})`:'';};
  document.getElementById('sc_tb').oninput=updateIMT;
  document.getElementById('sc_bb').oninput=updateIMT;
  document.getElementById('screeningForm').addEventListener('submit',e=>{
    e.preventDefault();
    const u=Session.user();
    const tb=parseFloat(document.getElementById('sc_tb').value)||null;
    const bb=parseFloat(document.getElementById('sc_bb').value)||null;
    const r=hitungIMT(bb,tb);
    const siswa_id=(u.role==='siswa')?u.siswa_id:Number(document.getElementById('sc_siswa').value);
    if(!siswa_id)return toast('Pilih siswa terlebih dahulu','error');
    syncKesehatanSiswa(siswa_id);
    DB.insert('screening',{siswa_id,tanggal:document.getElementById('sc_tanggal').value,tinggi_badan:tb,berat_badan:bb,imt:r?JSON.stringify(r):null,tekanan_darah:document.getElementById('sc_td').value.trim(),suhu:parseFloat(document.getElementById('sc_suhu').value)||null,nadi:parseInt(document.getElementById('sc_nadi').value)||null,respirasi:parseInt(document.getElementById('sc_respirasi').value)||null,gula_darah:parseInt(document.getElementById('sc_gula_darah').value)||null,mata:document.getElementById('sc_mata').value.trim(),telinga:document.getElementById('sc_telinga').value.trim(),gigi_mulut:document.getElementById('sc_gigi').value.trim(),kulit:document.getElementById('sc_kulit').value.trim(),catatan:document.getElementById('sc_catatan').value.trim(),petugas_id:u.id,petugas_nama:u.full_name});
    toast('Screening berhasil disimpan');
    setTimeout(()=>{if(u.role==='siswa')View.go('riwayat');else View.go('siswa-detail',{id:siswa_id});},500);
  });
}

function renderPermintaan(page){
  const user=Session.user();const isAdmin=user.role==='admin';const all=DB.db.permintaanObat;
  const stats={menunggu:all.filter(p=>p.status==='menunggu').length,disetujui:all.filter(p=>p.status==='disetujui').length,diberikan:all.filter(p=>p.status==='diberikan').length,total:all.length};
  page.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 slide-up">
      <div><h2 class="text-3xl font-bold text-gray-800 flex items-center gap-3"><span class="w-11 h-11 rounded-xl bg-emerald-100 flex items-center justify-center"><i class="fa-solid fa-pills text-emerald-600 text-xl"></i></span>Permintaan Obat</h2><p class="text-gray-500 mt-1">${isAdmin?'Tinjau & setujui permintaan obat':'Ajukan permintaan obat untuk siswa / guru / karyawan'}</p></div>
      <div class="flex gap-2"><button onclick="exportPermintaan()" class="inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold shadow-lg shadow-amber-600/30"><i class="fa-solid fa-file-excel"></i> Export</button><button onclick="openPermintaanForm()" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-plus"></i> Ajukan</button></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-lg bg-amber-100 flex items-center justify-center"><i class="fa-solid fa-clock text-amber-600 text-sm"></i></div><p class="text-xs text-gray-500 font-medium">Menunggu</p></div><p class="text-2xl font-bold text-gray-800">${stats.menunggu}</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center"><i class="fa-solid fa-check text-blue-600 text-sm"></i></div><p class="text-xs text-gray-500 font-medium">Disetujui</p></div><p class="text-2xl font-bold text-gray-800">${stats.disetujui}</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center"><i class="fa-solid fa-hand-holding-medical text-emerald-600 text-sm"></i></div><p class="text-xs text-gray-500 font-medium">Diberikan</p></div><p class="text-2xl font-bold text-gray-800">${stats.diberikan}</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><div class="flex items-center gap-2 mb-2"><div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chart-simple text-gray-600 text-sm"></i></div><p class="text-xs text-gray-500 font-medium">Total</p></div><p class="text-2xl font-bold text-gray-800">${stats.total}</p></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 slide-up"><div class="flex flex-wrap gap-2">
      <button onclick="filterPermintaan('all')" data-perm="all" class="perm-btn px-3 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">Semua <span class="opacity-80">(${all.length})</span></button>
      ${Object.entries(STATUS_PERMINTAAN).map(([k,st])=>{const c=all.filter(p=>p.status===k).length;return c?`<button onclick="filterPermintaan('${k}')" data-perm="${k}" class="perm-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700"><i class="fa-solid ${st.icon} text-${st.color}-600 mr-1"></i>${st.label} <span class="opacity-70">(${c})</span></button>`:'';}).join('')}
    </div></div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden slide-up"><div id="permList" class="divide-y divide-gray-100"></div></div>`;
  let activeStatus='all';
  const renderList=()=>{
    let list=[...all];if(activeStatus!=='all')list=list.filter(p=>p.status===activeStatus);
    const order={menunggu:0,disetujui:1,diberikan:2,ditolak:3};
    list.sort((a,b)=>{if(order[a.status]!==order[b.status])return order[a.status]-order[b.status];return new Date(b.tanggal)-new Date(a.tanggal);});
    const wrap=document.getElementById('permList');
    if(!list.length){wrap.innerHTML=`<div class="text-center py-16"><i class="fa-solid fa-pills text-5xl text-gray-300 mb-3"></i><p class="text-gray-500 font-medium">Belum ada permintaan obat</p></div>`;return;}
    wrap.innerHTML=list.map(p=>{
      const ob=DB.find('obat',p.obat_id);const st=STATUS_PERMINTAAN[p.status];
      const pType=p.penerima_type||(p.siswa_id?'siswa':'umum');
      let penerimaHTML='';
      if(pType==='siswa'&&p.siswa_id){const sw=DB.find('siswa',p.siswa_id);if(sw)penerimaHTML=`<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-user-graduate text-blue-500 mr-1"></i>Siswa: <button onclick="View.go('siswa-detail',{id:${sw.id}})" class="text-blue-600 hover:underline font-medium">${esc(sw.nama)}</button> (${esc(sw.kelas||'-')})</p>`;}
      else if(pType==='guru')penerimaHTML=`<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-chalkboard-user text-emerald-500 mr-1"></i>Guru: <span class="font-medium text-gray-700">${esc(p.penerima_nama||'-')}</span></p>`;
      else if(pType==='karyawan')penerimaHTML=`<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-user-tie text-purple-500 mr-1"></i>Karyawan: <span class="font-medium text-gray-700">${esc(p.penerima_nama||'-')}</span></p>`;
      else penerimaHTML=`<p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-boxes-stacked text-gray-400 mr-1"></i>Umum</p>`;
      return `<div class="p-4 lg:p-5 hover:bg-gray-50 transition-colors"><div class="flex flex-col sm:flex-row sm:items-start gap-3 sm:gap-4">
        <div class="w-12 h-12 rounded-full bg-${st.color}-100 flex items-center justify-center shrink-0"><i class="fa-solid ${st.icon} text-${st.color}-600 text-lg"></i></div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1"><p class="font-bold text-gray-800">${esc(ob?.nama||'Obat tidak ditemukan')}</p><span class="text-xs px-2 py-0.5 rounded-full bg-${st.color}-100 text-${st.color}-700 font-bold">${st.label}</span><span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-semibold">${PENERIMA_LABEL[pType]||'Umum'}</span></div>
          <p class="text-sm text-gray-700 font-semibold">Jumlah: ${p.jumlah} ${esc(ob?.satuan||'')}</p>
          <p class="text-xs text-gray-500 mt-1">Alasan: ${esc(p.alasan)}</p>
          ${penerimaHTML}
          <p class="text-[10px] text-gray-400 mt-2">Diminta: ${esc(p.pemohon_nama)} · ${fmtDateTime(p.tanggal)}</p>
          ${p.status!=='menunggu'&&p.approver_nama?`<p class="text-[10px] text-gray-400 mt-0.5">Diproses: ${esc(p.approver_nama)}</p>`:''}
          ${p.catatan_admin?`<div class="mt-2 p-2 rounded-lg bg-gray-50 border border-gray-100 text-xs text-gray-600"><b>Catatan admin:</b> ${esc(p.catatan_admin)}</div>`:''}
        </div>
        <div class="flex gap-1 sm:flex-col shrink-0 flex-wrap">
          ${isAdmin&&p.status==='menunggu'?`<button onclick="approvePermintaan(${p.id})" class="px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold"><i class="fa-solid fa-check mr-1"></i>Setujui</button><button onclick="rejectPermintaan(${p.id})" class="px-3 py-2 rounded-lg bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-semibold"><i class="fa-solid fa-xmark mr-1"></i>Tolak</button>`:''}
          ${p.status==='disetujui'?`<button onclick="berikanObat(${p.id})" class="px-3 py-2 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs font-semibold"><i class="fa-solid fa-hand-holding-medical mr-1"></i>Berikan</button>`:''}
          ${p.status==='menunggu'&&(p.pemohon_id===user.id||isAdmin)?`<button onclick="hapusPermintaan(${p.id})" class="p-2 rounded-lg text-rose-600 hover:bg-rose-50" title="Batalkan"><i class="fa-solid fa-trash"></i></button>`:''}
        </div>
      </div></div>`;
    }).join('');
  };
  window.filterPermintaan=s=>{activeStatus=s;document.querySelectorAll('.perm-btn').forEach(b=>{b.className=b.dataset.perm===s?'perm-btn px-3 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white':'perm-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700';});renderList();};
  renderList();
}

window.openPermintaanForm = () => {
  const obatList=DB.db.obat.filter(o=>o.stok>0);
  if(!obatList.length)return toast('Stok obat kosong. Hubungi admin.','error');
  const kunjunganList=DB.db.kunjungan.filter(k=>k.status==='menunggu'||k.status==='diperiksa');
  document.getElementById('modalContainer').innerHTML = `
    <div class="fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4 overflow-y-auto slide-up">
      <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full my-8">
        <div class="flex items-center justify-between p-6 border-b border-gray-100"><div><h3 class="font-bold text-gray-800 text-lg">Ajukan Permintaan Obat</h3><p class="text-xs text-gray-500 mt-0.5">Permintaan akan ditinjau admin</p></div><button onclick="closeModal()" class="p-2 rounded-lg hover:bg-gray-100"><i class="fa-solid fa-xmark text-gray-500"></i></button></div>

              <button type="button" data-type="guru" class="penerima-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors">Guru</button>
              <button type="button" data-type="karyawan" class="penerima-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors">Karyawan</button>
            </div>
          </div>
          <div id="penerimaFormSiswa" class="hidden">${kelasSiswaSelectHTML('pm_kelas','pm_siswa',{requiredSiswa:false})}</div>
          <div id="penerimaFormNonSiswa" class="hidden">
            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Nama <span id="penerimaNamaLabel">Guru</span> *</label>
            <input id="pm_penerima_nama" placeholder="Nama lengkap guru/karyawan" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/>
          </div>
          ${kunjunganList.length?`<div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Terkait Kunjungan (opsional)</label><select id="pm_kunjungan" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm bg-white"><option value="">- Tidak terkait -</option>${kunjunganList.map(k=>{const sw=DB.find('siswa',k.siswa_id);return `<option value="${k.id}">${esc(sw?.nama||'-')} (${esc(sw?.kelas||'-')}) — ${esc(k.keluhan)}</option>`;}).join('')}</select></div>`:''}

    if(!ob)return toast('Obat tidak ditemukan','error');
    if(jumlah>ob.stok)return toast(`Jumlah melebihi stok (${ob.stok})`,'error');
    let siswa_id=null, penerima_nama=null;
    if(penerimaType==='siswa'){
      const sv=document.getElementById('pm_siswa')?.value;
      if(!sv)return toast('Pilih siswa terlebih dahulu','error');
      siswa_id=Number(sv);
    } else if(penerimaType==='guru'||penerimaType==='karyawan'){
      penerima_nama=document.getElementById('pm_penerima_nama')?.value.trim();
      if(!penerima_nama)return toast('Nama '+penerimaType+' wajib diisi','error');
    }
    const kunjSel=document.getElementById('pm_kunjungan')?.value;
    DB.insert('permintaanObat',{
      obat_id,jumlah,alasan:document.getElementById('pm_alasan').value.trim(),
      penerima_type:penerimaType, siswa_id, penerima_nama,
      kunjungan_id:kunjSel?Number(kunjSel):null,
      status:'menunggu',pemohon_id:u.id,pemohon_nama:u.full_name,tanggal:new Date().toISOString()
    });
    toast('Permintaan dikirim');closeModal();View.render();
  });
};

window.berikanObat = id => {
  const p=DB.find('permintaanObat',id);if(!p)return;
  const ob=DB.find('obat',p.obat_id);if(!ob)return;
  if(ob.stok<p.jumlah)return toast(`Stok tidak cukup (${ob.stok})`,'error');
  DB.update('obat',ob.id,{stok:ob.stok-p.jumlah});
  DB.update('permintaanObat',id,{status:'diberikan',tanggal_diberikan:new Date().toISOString()});
  toast(`Obat diberikan. Stok ${ob.nama}: ${ob.stok-p.jumlah}`);View.render();
};

window.exportPermintaan = () => {
  const all=DB.db.permintaanObat;if(!all.length)return toast('Belum ada data','error');
  const rows=all.sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal)).map(p=>{
    const ob=DB.find('obat',p.obat_id);
    const pType=p.penerima_type||(p.siswa_id?'siswa':'umum');
    let penerima='Umum';
    if(pType==='siswa'&&p.siswa_id){const sw=DB.find('siswa',p.siswa_id);if(sw)penerima=`${sw.nama} (${sw.kelas||'-'})`;}
    else if((pType==='guru'||pType==='karyawan')&&p.penerima_nama)penerima=p.penerima_nama;
    return {
      'Tanggal':fmtDateTime(p.tanggal),'Obat':ob?.nama||'-','Jumlah':`${p.jumlah} ${ob?.satuan||''}`,
      'Jenis Penerima':PENERIMA_LABEL[pType]||'Umum','Penerima':penerima,
      'Alasan':p.alasan,'Status':STATUS_PERMINTAAN[p.status]?.label||p.status,
      'Pemohon':p.pemohon_nama||'-','Approver':p.approver_nama||'','Catatan':p.catatan_admin||''
    };
  });
  exportExcel(rows,'Permintaan Obat',`Permintaan_Obat_UKS_${todayISO()}.xlsx`);
};

  page.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 slide-up">
      <div><h2 class="text-3xl font-bold text-gray-800 flex items-center gap-3"><span class="w-11 h-11 rounded-xl bg-purple-100 flex items-center justify-center"><i class="fa-solid fa-prescription-bottle-medical text-purple-600 text-xl"></i></span>Stok Obat</h2><p class="text-gray-500 mt-1">Kelola master data & persediaan obat UKS</p></div>
      <div class="flex gap-2"><button onclick="exportObat()" class="inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold shadow-lg shadow-amber-600/30"><i class="fa-solid fa-file-excel"></i> Export</button><button onclick="openObatForm()" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-semibold shadow-lg shadow-purple-600/30"><i class="fa-solid fa-plus"></i> Tambah Obat</button></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><p class="text-2xl font-bold text-gray-800">${stats.total}</p><p class="text-xs text-gray-500 mt-1">Jenis Obat</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><p class="text-2xl font-bold text-blue-600">${stats.totalItem}</p><p class="text-xs text-gray-500 mt-1">Total Item</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><p class="text-2xl font-bold text-amber-600">${stats.stokRendah}</p><p class="text-xs text-gray-500 mt-1">Stok Rendah</p></div>
      <div class="bg-white rounded-2xl p-4 border border-gray-100 slide-up"><p class="text-2xl font-bold text-rose-600">${stats.stokHabis}</p><p class="text-xs text-gray-500 mt-1">Stok Habis</p></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden slide-up">
      <div class="p-4 border-b border-gray-100"><div class="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 max-w-md"><i class="fa-solid fa-magnifying-glass text-gray-400"></i><input id="obatSearch" type="text" placeholder="Cari obat..." class="w-full bg-transparent outline-none text-sm"/></div></div>
      <div class="overflow-x-auto"><table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-100"><tr class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider"><th class="px-6 py-3">Nama</th><th class="px-6 py-3">Kategori</th><th class="px-6 py-3">Stok</th><th class="px-6 py-3">Min</th><th class="px-6 py-3">Status</th><th class="px-6 py-3 text-right">Aksi</th></tr></thead>
        <tbody id="obatTbody" class="divide-y divide-gray-100"></tbody>
      </table></div>

  const renderList=list=>{

    tb.innerHTML=list.map(o=>{
      let badge='';
      if(o.stok===0)badge='<span class="text-xs px-2 py-1 rounded-full bg-rose-100 text-rose-700 font-semibold">● Habis</span>';
      else if(o.stok<=o.stok_min)badge='<span class="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold">● Rendah</span>';
      else badge='<span class="text-xs px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold">● Tersedia</span>';
      return `<tr class="hover:bg-gray-50">
        <td class="px-6 py-4"><p class="font-semibold text-gray-800 text-sm">${esc(o.nama)}</p>${o.deskripsi?`<p class="text-xs text-gray-500">${esc(o.deskripsi)}</p>`:''}</td>

        <td class="px-6 py-4 text-sm font-bold text-gray-800">${o.stok} <span class="font-normal text-gray-500">${esc(o.satuan)}</span></td>
        <td class="px-6 py-4 text-sm text-gray-500">${o.stok_min}</td>
        <td class="px-6 py-4">${badge}</td>
        <td class="px-6 py-4 text-right whitespace-nowrap">
          <button onclick="tambahStok(${o.id})" class="p-2 rounded-lg text-emerald-600 hover:bg-emerald-50" title="Tambah Stok"><i class="fa-solid fa-plus-circle"></i></button>
          <button onclick="openObatForm(${o.id})" class="p-2 rounded-lg text-blue-600 hover:bg-blue-50" title="Edit"><i class="fa-solid fa-pen"></i></button>
          ${user.role==='admin'?`<button onclick="hapusObat(${o.id})" class="p-2 rounded-lg text-rose-600 hover:bg-rose-50" title="Hapus"><i class="fa-solid fa-trash"></i></button>`:''}
        </td>
      </tr>`;
    }).join('');
  };
  renderList(all);
  document.getElementById('obatSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();renderList(all.filter(o=>(o.nama||'').toLowerCase().includes(q)||(o.kategori||'').toLowerCase().includes(q)));});

    <div class="fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4 overflow-y-auto slide-up">
      <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full my-8">

            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Kategori</label><input id="ob_kategori" value="${esc(o?.kategori||'')}" placeholder="Analgesik" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Satuan</label><input id="ob_satuan" value="${esc(o?.satuan||'')}" placeholder="Tablet" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Stok *</label><input id="ob_stok" type="number" min="0" required value="${o?.stok||0}" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>

          <div><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Deskripsi</label><textarea id="ob_deskripsi" rows="2" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm">${esc(o?.deskripsi||'')}</textarea></div>
          <div class="flex gap-3 justify-end pt-2"><button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium">Batal</button><button type="submit" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-semibold"><i class="fa-solid fa-floppy-disk mr-2"></i> Simpan</button></div>
        </form>
      </div>
    </div>`;
  document.getElementById('obatForm').addEventListener('submit',e=>{
    e.preventDefault();
    const body={nama:document.getElementById('ob_nama').value.trim(),kategori:document.getElementById('ob_kategori').value.trim(),satuan:document.getElementById('ob_satuan').value.trim()||'Pcs',stok:Number(document.getElementById('ob_stok').value),stok_min:Number(document.getElementById('ob_stok_min').value)||5,deskripsi:document.getElementById('ob_deskripsi').value.trim()};
    if(id){DB.update('obat',id,body);toast('Obat diperbarui');}else{DB.insert('obat',body);toast('Obat ditambahkan');}
    closeModal();View.render();
  });

window.tambahStok = id => {
  if(!['admin','petugas'].includes(Session.user()?.role))return toast('Akses ditolak','error');
  const o=DB.find('obat',id);if(!o)return;
  document.getElementById('modalContainer').innerHTML = `
    <div class="fixed inset-0 z-[80] bg-black/50 flex items-center justify-center p-4 slide-up">
      <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">
        <div class="flex items-center gap-3 mb-4"><div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center"><i class="fa-solid fa-plus text-emerald-600 text-xl"></i></div><div><h3 class="font-bold text-gray-800 text-lg">Tambah Stok</h3><p class="text-xs text-gray-500">${esc(o.nama)} (stok: ${o.stok})</p></div></div>
        <div class="mb-4"><label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase">Jumlah *</label><input id="ts_jumlah" type="number" min="1" required value="10" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:border-blue-500 text-sm"/></div>
        <div class="flex gap-3 justify-end"><button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-sm">Batal</button><button onclick="confirmTambahStok(${id})" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm">Tambah</button></div>
      </div>
    </div>`;
};
window.confirmTambahStok = id => {
  const o=DB.find('obat',id);if(!o)return;
  const j=Number(document.getElementById('ts_jumlah').value);
  if(!j||j<=0)return toast('Jumlah tidak valid','error');
  DB.update('obat',id,{stok:o.stok+j});
  toast(`Stok ${o.nama} +${j}. Total: ${o.stok+j}`);closeModal();View.render();
};
window.hapusObat = async id => {
  if(Session.user().role!=='admin')return toast('Hanya admin','error');
  const o=DB.find('obat',id);if(!o)return;
  if(!await confirmDialog(`Hapus obat "${o.nama}"?`))return;
  DB.delete('obat',id);toast('Obat dihapus');View.render();
};
window.exportObat = () => {
  const all=DB.db.obat;if(!all.length)return toast('Belum ada data','error');
  const rows=all.map(o=>({'Nama':o.nama,'Kategori':o.kategori||'','Satuan':o.satuan||'','Stok':o.stok,'Min':o.stok_min,'Status':o.stok===0?'Habis':o.stok<=o.stok_min?'Rendah':'Tersedia','Deskripsi':o.deskripsi||''}));
  exportExcel(rows,'Stok Obat',`Stok_Obat_UKS_${todayISO()}.xlsx`);
};

function renderSiswaRawan(page){
  const all=analisaSiswaRawan();
  const stats={total:all.length,tinggi:all.filter(x=>x.level==='tinggi').length,sedang:all.filter(x=>x.level==='sedang').length,rendah:all.filter(x=>x.level==='rendah').length};
  const kategoriCount={};Object.keys(RISK_CATEGORIES).forEach(k=>{kategoriCount[k]=all.filter(x=>x.risks.includes(k)).length;});
  page.innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 slide-up">
      <div><h2 class="text-3xl font-bold text-gray-800 flex items-center gap-3"><span class="w-11 h-11 rounded-xl bg-rose-100 flex items-center justify-center"><i class="fa-solid fa-user-injured text-rose-600 text-xl"></i></span>Siswa Rawan</h2><p class="text-gray-500 mt-1">Deteksi otomatis siswa berisiko berdasarkan hasil screening (TA ${esc(DB.db.tahunAjaranAktif)}). Siswa yang belum screening tidak termasuk, kecuali siswa yang sering registrasi sebagai pasien (≥${SERING_KUNJUNGAN.jumlah} kunjungan dalam ${SERING_KUNJUNGAN.hari} hari).</p></div>
      <div class="flex gap-2"><button onclick="exportSiswaRawan()" class="inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold shadow-lg shadow-amber-600/30"><i class="fa-solid fa-file-excel"></i> Export</button><button onclick="cetakSiswaRawan()" class="inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow-lg shadow-emerald-600/30"><i class="fa-solid fa-print"></i> Cetak</button></div>
    </div>
    ${stats.total?`<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-gradient-to-br from-gray-600 to-gray-800 rounded-2xl p-5 text-white shadow-lg slide-up"><p class="text-3xl font-bold">${stats.total}</p><p class="text-gray-200 text-sm mt-1">Total Rawan</p></div>
      <div class="bg-gradient-to-br from-rose-500 to-rose-700 rounded-2xl p-5 text-white shadow-lg slide-up"><p class="text-3xl font-bold">${stats.tinggi}</p><p class="text-rose-100 text-sm mt-1">Tinggi</p></div>
      <div class="bg-gradient-to-br from-amber-500 to-amber-700 rounded-2xl p-5 text-white shadow-lg slide-up"><p class="text-3xl font-bold">${stats.sedang}</p><p class="text-amber-100 text-sm mt-1">Sedang</p></div>
      <div class="bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-2xl p-5 text-white shadow-lg slide-up"><p class="text-3xl font-bold">${stats.rendah}</p><p class="text-emerald-100 text-sm mt-1">Rendah</p></div>
    </div>`:''}
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6 slide-up">
      <p class="text-xs font-semibold text-gray-600 uppercase tracking-wide mb-3">Filter Kategori Risiko</p>
      <div class="flex flex-wrap gap-2">
        <button onclick="filterRawan('all')" data-cat="all" class="cat-btn px-3 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">Semua <span class="ml-1 text-xs opacity-80">(${stats.total})</span></button>
        ${Object.entries(RISK_CATEGORIES).map(([k,cat])=>kategoriCount[k]?`<button onclick="filterRawan('${k}')" data-cat="${k}" class="cat-btn px-3 py-2 rounded-lg text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700"><i class="fa-solid ${cat.icon} text-${cat.color}-600 mr-1"></i>${cat.label} <span class="ml-1 text-xs opacity-70">(${kategoriCount[k]})</span></button>`:'').join('')}
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden slide-up">
      <div class="p-4 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 max-w-md w-full sm:w-auto"><i class="fa-solid fa-magnifying-glass text-gray-400"></i><input id="rawanSearch" type="text" placeholder="Cari..." class="w-full bg-transparent outline-none text-sm"/></div>
        <span id="rawanCount" class="text-sm text-gray-500"></span>
      </div>
      <div id="rawanList" class="divide-y divide-gray-100"></div>
    </div>`;
  let activeCat='all',activeSearch='';
  const renderList=()=>{
    let list=all;
    if(activeCat!=='all')list=list.filter(x=>x.risks.includes(activeCat));
    if(activeSearch){const q=activeSearch.toLowerCase();list=list.filter(x=>(x.siswa.nama||'').toLowerCase().includes(q)||(x.siswa.nis||'').toLowerCase().includes(q)||(x.siswa.kelas||'').toLowerCase().includes(q));}
    list=[...list].sort((a,b)=>b.severity-a.severity);
    document.getElementById('rawanCount').textContent=`${list.length} siswa`;
    const wrap=document.getElementById('rawanList');
    if(!list.length){wrap.innerHTML=`<div class="text-center py-16"><i class="fa-solid fa-shield-heart text-5xl text-emerald-300 mb-3"></i><p class="text-gray-500 font-medium">Tidak ada siswa rawan</p></div>`;return;}
    wrap.innerHTML=list.map(x=>`<div class="p-4 lg:p-5 hover:bg-gray-50 transition-colors"><div class="flex flex-col sm:flex-row sm:items-start gap-3 sm:gap-4">
      <div class="w-12 h-12 rounded-full bg-${x.levelColor}-100 flex items-center justify-center shrink-0"><i class="fa-solid fa-user text-${x.levelColor}-600 text-lg"></i></div>
